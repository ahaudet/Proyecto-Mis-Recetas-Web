<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Recetas y Especias - Edición Editorial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@14.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-papel: #fcfbfa;
            --color-borde: #e2dacd;
            --color-texto: #2c2520;
            --color-acento: #5c1d1d;
            --color-categoria: #8c7662;
        }

        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .book-container {
            display: flex; width: 95vw; max-width: 1150px; height: 84vh; min-height: 500px;
            background-color: var(--color-papel); box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border-radius: 4px; position: relative; transition: all 0.3s ease;
        }

        .book-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent 50%, rgba(0,0,0,0.1));
            transform: translateX(-50%); pointer-events: none; z-index: 10;
        }

        .page {
            width: 50%; height: 100%; padding: 35px 40px; box-sizing: border-box;
            overflow-y: auto; display: flex; flex-direction: column;
        }

        .book-container.closed { max-width: 575px; }
        .book-container.closed::after { display: none; }
        .book-container.closed .page-right { display: none; }
        .book-container.closed .page-left { width: 100%; border: none; }

        .page-left { border-right: 1px solid rgba(0,0,0,0.05); }

        /* Cabeceras de Página y Retornos Nav */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .return-link { font-family: Arial, sans-serif; font-size: 8.5pt; color: var(--color-acento); text-decoration: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .return-link:hover { text-decoration: underline; color: var(--color-categoria); }

        .cover-content {
            height: 100%; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; border: 2px solid var(--color-acento);
            margin: 10px; padding: 25px; position: relative;
        }
        .cover-title { font-size: clamp(22pt, 4vw, 40pt); color: var(--color-acento); margin-bottom: 5px; font-weight: normal; }
        .cover-subtitle { font-size: 13pt; letter-spacing: 4px; color: var(--color-categoria); text-transform: uppercase; }

        h1 { font-size: 24pt; color: var(--color-acento); margin: 0; line-height: 1.1; font-weight: normal; }
        h2 { font-size: 10.5pt; text-transform: uppercase; border-bottom: 1px dashed var(--color-borde); padding-bottom: 4px; margin-top: 15px; color: var(--color-acento); letter-spacing: 1px; }
        
        .item-image { width: 100%; max-height: 170px; object-fit: cover; border-radius: 2px; margin: 10px 0; border: 1px solid var(--color-borde); }
        p, li { font-size: 10.5pt; line-height: 1.5; text-align: left; color: var(--color-texto); }
        ul, ol { padding-left: 20px; margin-top: 5px; margin-bottom: 5px; }
        li { margin-bottom: 5px; }
        
        .chef-notes { background-color: #f5efe6; border-left: 3px solid var(--color-categoria); padding: 12px; margin-top: auto; font-style: italic; font-size: 9.5pt; }

        /* DISEÑO ESTRUCTURADO DEL ÍNDICE GENERAL */
        .index-container { width: 100%; display: flex; flex-direction: column; gap: 25px; margin-top: 15px; }
        .index-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; width: 100%; }
        .index-section { display: flex; flex-direction: column; }
        .index-section h3 { font-size: 10pt; color: var(--color-acento); text-transform: uppercase; margin: 0 0 8px 0; border-bottom: 2px solid var(--color-categoria); padding-bottom: 3px; letter-spacing: 1px; }
        .index-list { list-style: none; padding: 0; margin: 0; }
        .index-item { display: flex; justify-content: space-between; align-items: flex-end; font-size: 9pt; margin-bottom: 6px; cursor: pointer; color: var(--color-texto); line-height: 1.2; }
        .index-item:hover { color: var(--color-acento); font-weight: bold; }
        .index-item .dots { flex-grow: 1; border-bottom: 1px dotted #aaa; margin: 0 5px; position: relative; top: -3px; }

        /* ÍNDICE DE LAS 24 ESPECIAS */
        .glossary-index-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; width: 100%; margin-top: 15px; }

        /* GRÁFICO SENSORIAL */
        .sensory-chart { display: flex; flex-direction: column; gap: 6px; background: #fdfaf4; padding: 10px; border: 1px solid var(--color-borde); border-radius: 4px; margin-top: 10px; }
        .chart-row { display: flex; align-items: center; font-size: 9pt; }
        .chart-label { width: 70px; font-weight: bold; color: var(--color-categoria); }
        .chart-bar-container { flex-grow: 1; background: #eaddca; height: 8px; border-radius: 4px; overflow: hidden; }
        .chart-bar { background: var(--color-acento); height: 100%; border-radius: 4px; }

        /* CONTROLES NAVEGACIÓN */
        .nav-controls { margin-top: 15px; display: flex; gap: 15px; background: white; padding: 10px 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); align-items: center; z-index: 100; }
        .nav-btn { background: none; border: 1px solid #8c7662; color: #8c7662; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .nav-btn:hover { background: #8c7662; color: white; }

        /* RESPONSIVE MÓVIL OPTIMIZADO */
        @media (max-width: 850px) {
            .book-container { height: 78vh; min-height: 400px; }
            .page { padding: 15px 12px; }
            h1 { font-size: 14pt; }
            h2 { font-size: 9.5pt; margin-top: 8px; }
            p, li { font-size: 8.5pt; line-height: 1.3; text-align: left; }
            ul, ol { padding-left: 15px; }
            .item-image { max-height: 90px; margin: 6px 0; }
            .index-row { grid-template-columns: 1fr; gap: 15px; }
            .glossary-index-grid { grid-template-columns: 1fr; gap: 6px; }
            .nav-controls { scale: 0.85; margin-top: 8px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 5px; }
            .book-container { height: 82vh; min-height: 240px; }
            .page { padding: 10px 15px; }
            h1 { font-size: 12pt; }
            h2 { font-size: 9pt; margin-top: 4px; }
            p, li { font-size: 8pt; line-height: 1.2; text-align: left; }
            .item-image { max-height: 55px; margin: 4px 0; }
            .nav-controls { scale: 0.75; margin-top: 4px; padding: 4px 15px; }
        }
    </style>
</head>
<body>

    <div class="book-container closed" id="book">
        <div class="page page-left" id="left-page"></div>
        <div class="page page-right" id="right-page"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goBack()">Anterior</button>
        <span id="page-indicator" style="font-size: 9pt; font-weight: bold; font-family: sans-serif;">Cargando...</span>
        <button class="nav-btn" onclick="goForward()">Siguiente</button>
    </div>

    <script>
        // BASE DE DATOS MAESTRA - LAS 24 ESPECIAS COMPLETAS CON SUS VALORES SENSORIALES
        const GLOSARIO_DATA = [
            { 
                title: "Ají Molido", flag: "🇦🇷", category: "Picante", 
                introduction: "Fruto desecado y triturado del género Capsicum, pilar de la cocina criolla y rioplatense.", 
                sensory: { picante: 60, aromatico: 40, terroso: 50, dulce: 30 }, 
                sections: [
                    { title: "Origen y Geografía", content: "Noroeste Argentino (región del NOA), principalmente en los valles calchaquíes de Salta y Catamarca, donde las condiciones del suelo y el secado artesanal al sol consolidaron su perfil identitario." }, 
                    { title: "Perfil Sensorial", content: "Picor moderado y amigable al paladar. Presenta un perfil complejo que equilibra notas sutilmente dulces, frutales y un marcado ahumado natural. Textura rústica con escamas rojas y pepitas blanquecinas." }, 
                    { title: "Usos comunes", content: "Es el alma mater del chimichurri tradicional y el adobo criollo. Base obligatoria para rellenos de empanadas, locros y guisados de lentejas. Se aconseja hidratarlo unos minutos en agua tibia antes de usarlo en emulsiones aceitosas." }
                ] 
            },
            { 
                title: "Anís Estrellado", flag: "🇨🇳", category: "Aromático", 
                introduction: "Fruto seco con forma de estrella de ocho puntas obtenido del árbol perennifolio Illicium verum, famoso por su alta concentración de anetol.", 
                sensory: { picante: 10, aromatico: 95, terroso: 20, dulce: 80 }, 
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las regiones del suroeste de China, Corea y Japón, donde se ha cultivado tradicionalmente durante milenios tanto para uso culinario como en la medicina tradicional oriental." },
                    { title: "Perfil Sensorial", content: "Se caracteriza por un aroma licoroso, penetrante y profundamente dulce. En boca ofrece un sabor anisado intenso con notas sutilmente amaderadas y un dejo ligeramente fresco en el retrogusto." },
                    { title: "Usos comunes", content: "Pilar fundamental del Polvo de 5 Especias chino e indispensable para caldos asiáticos como el Pho. En Occidente destaca en repostería invernal, infusiones y destilación de licores." }
                ] 
            },
            {
                title: "Baharat", flag: "🌍", category: "Mezcla",
                introduction: "Mezcla de especias cálida, aromática y de notas terrosas o ahumadas, fundamental en Oriente Medio, la región del Golfo Arábigo, Grecia y Turquía.",
                sensory: { picante: 40, aromatico: 80, terroso: 85, dulce: 40 },
                sections: [
                    { title: "Origen y Geografía", content: "Desarrollada históricamente a partir del rol de los comerciantes árabes en el mundo antiguo. Se extendió ampliamente por el Mediterráneo, generando variantes locales como la turca o la tunecina." },
                    { title: "Perfil Sensorial", content: "Perfil cálido con fuertes notas terrosas y ahumadas. Solo una pizca es capaz de potenciar los sabores de carnes, pollos, pescados (sobre todo grasos como caballa y salmón), verduras, sopas y salsas." },
                    { title: "Usos comunes", content: "Se usa en marinadas o directo en carnes picadas. RECETA CASERA: Combinar 2 cdas de pimienta negra, cilantro y comino; 1 cdta de cardamomo; 1/2 cdta de clavos; y 4 palitos de canela. Tostar en sartén, enfriar, moler y mezclar con pimentón y nuez moscada." }
                ]
            },
            {
                title: "Canela", flag: "🇱🇰", category: "Dulce",
                introduction: "Corteza interna desecada y enrollada del árbol de hoja perenne Cinnamomum verum, una de las especias más antiguas del mundo.",
                sensory: { picante: 20, aromatico: 90, terroso: 30, dulce: 95 },
                sections: [
                    { title: "Origen y Geografía", content: "Originaria de Sri Lanka y el sur de la India. Existen más de 100 variedades, destacando la canela de Ceilán por su alta calidad frente a la Casia o canela de China, que posee un aroma más rústico." },
                    { title: "Perfil Sensorial", content: "Sabor y aroma intensamente dulces y amaderados. La versión molida libera su sabor de forma rápida, mientras que en rama ofrece un perfume más sutil y prolongado, ideal para procesos de infusión." },
                    { title: "Usos comunes", content: "Fundamental en la aromatización de postres lácteos, bizcochos y galletas. En platos salados, aporta intensidad al curry. Se puede elaborar una esencia sumergiendo 2 ramas en ron blanco durante 2 semanas." }
                ]
            },
            {
                title: "Cardamomo", flag: "🇮🇳", category: "Herbal",
                introduction: "Semilla altamente aromática de la familia del jengibre, considerada una de las especias más caras del mundo junto al azafrán.",
                sensory: { picante: 30, aromatico: 95, terroso: 10, dulce: 60 },
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las selvas de la India meridional, Sri Lanka y Malaysia. Actualmente, Guatemala es uno de los principales productores mundiales, reconocido por lograr una calidad excepcional." },
                    { title: "Perfil Sensorial", content: "Aroma intenso, sofisticado y afrutado. Presenta tres variedades comerciales: el Verde (el más sabroso), el Negro (más grande, amargo y con un perfil ahumado) y el Blanco (mucho menos intenso)." },
                    { title: "Usos comunes", content: "En India se usa en curries y arroces. En Oriente Medio se mezcla con café. En Países Nórdicos y Centroeuropa destaca en repostería y en el vino caliente Glühwein. Se aconseja moler al momento." }
                ]
            },
            {
                title: "Cayena", flag: "🇬🇫", category: "Picante",
                introduction: "Pimiento obtenido de la planta solanácea Capsicum annuum, triturado tras su secado en un polvo de intenso color rojizo.",
                sensory: { picante: 95, aromatico: 20, terroso: 30, dulce: 10 },
                sections: [
                    { title: "Origen y Geografía", content: "Originaria de América del Sur y Central. Su nombre se asocia a la ciudad y río Cayena en la Guayana Francesa. Fue introducida en Europa por error creyendo que era la pimienta tradicional de oriente." },
                    { title: "Perfil Sensorial", content: "Su potente picor no aporta un sabor propio a los platos, lo que la vuelve sumamente versátil. El responsable de su carácter es la capsaicina, concentrada principalmente en las semillas internas." },
                    { title: "Usos comunes", content: "Utilizada globalmente para dar pungencia a estofados, legumbres, platos de caza y embutidos. Ingrediente base de la salsa Tabasco y de aceites picantes para pizzas. La versión molida se fusiona por completo en caldos." }
                ]
            },
            {
                title: "Cilantro", flag: "🌍", category: "Herbal",
                introduction: "Hierba anual de la familia de las apiáceas, caracterizada por la dualidad gastronómica entre sus hojas frescas y sus semillas secas.",
                sensory: { picante: 0, aromatico: 85, terroso: 10, dulce: 20 },
                sections: [
                    { title: "Origen y Geografía", content: "Nativo del Mediterráneo y el Cáucaso, expandido masivamente hacia Asia y posteriormente hacia América Latina, transformándose en el sello verde de las gastronomías mexicana y peruana." },
                    { title: "Perfil Sensorial", content: "Ofrece un carácter fresco, intensamente cítrico y vibrante en sus hojas. Ciertos paladares perciben un matiz jabonoso debido a componentes aldehídos. Es crucial diferenciar su perfil herbal del de sus semillas (coriandro)." },
                    { title: "Usos comunes", content: "Elemento obligatorio en ceviches, guacamole, pico de gallo y salsas criollas. Sus aceites aromáticos son volátiles y se destruyen con el calor, por lo que debe incorporarse estrictamente al final de la cocción." }
                ]
            },
            {
                title: "Clavo de Olor", flag: "🇮🇩", category: "Dulce",
                introduction: "Botones florales secos recolectados antes de abrir del árbol Syzygium aromaticum, famoso por su alta concentración de aceites.",
                sensory: { picante: 50, aromatico: 95, terroso: 40, dulce: 70 },
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las legendarias Islas Molucas en Indonesia (Islas de las Especias). Durante la Edad Media, su monopolio comercial desató disputas navales a escala global. Hoy se cultiva en Madagascar, Tanzania y Brasil." },
                    { title: "Perfil Sensorial", content: "Aroma penetrante, cálido y profundamente amaderado. En boca despliega un sabor intenso y astringente que deja una sensación levemente anestésica en la lengua debido al eugenol." },
                    { title: "Usos comunes", content: "Fundamental en fondos de carne, salsas clásicas (bechamel claveteada en cebolla), charcutería y conservas dulces. Debe usarse con estrefa moderación para no saturar químicamente el plato." }
                ]
            },
            {
                title: "Comino", flag: "🇪🇬", category: "Picante",
                introduction: "Semilla seca proveniente de la planta Cuminum cyminum, considerada uno de los pilares más antiguos de la cocina terrosa.",
                sensory: { picante: 40, aromatico: 75, terroso: 95, dulce: 10 },
                sections: [
                    { title: "Origen y Geografía", content: "Nativo del Mediterráneo Oriental y Asia Central, usado en el antiguo Egipto para gastronomía y momificación. Llegó a América Latina volviéndose un elemento identitario de la cocina criolla." },
                    { title: "Perfil Sensorial", content: "Sabor y aroma fuertes, penetrantes, cálidos y con un marcado trasfondo terroso, acompañado de notas sutilmente amargas. Su presencia es persistente y puede dominar el plato si no se dosifica con precisión." },
                    { title: "Usos comunes", content: "Componente obligatorio en la arquitectura de sabor de las empanadas criollas tradicionales, las humitas, los tamales y los guisados de legumbres. Se recomienda tostar la semilla antes de molerla." }
                ]
            },
            {
                title: "Coriandro", flag: "🌍", category: "Herbal",
                introduction: "Semilla pequeña y redonda obtenida de la planta Coriandrum sativum, la misma que produce la hierba fresca conocida como cilantro.",
                sensory: { picante: 10, aromatico: 70, terroso: 40, dulce: 50 },
                sections: [
                    { title: "Origen y Geografía", content: "Proviene de la misma planta que el cilantro fresco. Históricamente es un ingrediente clave expandido desde curries indios hasta mezclas de Oriente Medio y la panadería de centeno escandinava." },
                    { title: "Perfil Sensorial", content: "Al triturarse desprende un aroma cálido a limón con notas sutilmente dulces y un toque a nuez. Sus notas difieren por completo de la hoja fresca, por lo que no son intercambiables." },
                    { title: "Usos comunes", content: "Aporta un sabor profundo y suave en sopas, guisos, verduras asadas y condimentos para carne. Se recomienda tostar las semillas enteras antes de molerlas para liberar sus notas cítricas." }
                ]
            },
            {
                title: "Curry", flag: "🇮🇳", category: "Mezcla",

                sections: [
                    { title: "Origen y Geografía", content: "Gastronomía de la India. Se popularizó globalmente durante los siglos XIX y XX a través de la exportación y la estandarización comercial de polvos fuera de su país de origen." },
                    { title: "Perfil Sensorial", content: "Complejo, cálido y profundamente aromático. Mientras que en Occidente posee un sabor predecible, en la cocina hindú presenta una enorme diversidad diseñada artesanalmente para cada receta." },
                    { title: "Usos comunes", content: "Base para estofados, salsas, legumbres y arroces. La columna vertebral incluye cilantro, cúrcuma, comino y alholva, añadiendo jengibre, hinojo, cardamomo y variantes de pimienta." }
                ]
            },
            {
                title: "Garam Masala", flag: "🇮🇳", category: "Mezcla",
                introduction: "Mezcla de especias originaria del norte de la India cuyo nombre significa 'mezcla caliente'. No contiene cúrcuma.",
                sensory: { picante: 30, aromatico: 90, terroso: 60, dulce: 40 },
                sections: [
                    { title: "Origen y Geografía", content: "Originaria del norte de la India. No existe una receta única; los ingredientes varían notablemente de pueblo en pueblo e incluso entre familias que mantienen su propia tradición." },
                    { title: "Perfil Sensorial", content: "Aroma y sabor cálido, profundo y sumamente armónico. En una proporción equilibrada, ninguna especia destaca excesivamente sobre las demás, resultando en un condimento sofisticado." },
                    { title: "Usos comunes", content: "Excelente para condimentar platos de carnes, pescados y verduras. RECETA CASERA: Combinar comino, cilantro, pimienta negra, cardamomo, canela, nuez moscada, clavo y chile. Tostar a fuego suave y moler." }
                ]
            },
            {
                title: "Jengibre", flag: "🇮🇳", category: "Herbal",
                introduction: "Rizoma subterráneo de la planta Zingiber officinale, valorado por su perfil picante, fresco y cítrico.",
                sensory: { picante: 70, aromatico: 85, terroso: 20, dulce: 40 },
                sections: [
                    { title: "Origen y Geografía", content: "Nativo del sudeste asiático y el sur de la India. Fue una de las primeras especias orientales en llegar a Occidente gracias a mercaderes fenicios y romanos. India y Jamaica lideran su producción." },
                    { title: "Perfil Sensorial", content: "Despliega un aroma intensamente cítrico, refrescante y amaderado. En boca ofrece un picor punzante pero limpio debido al gingerol, que al cocinarse se transforma en zingerona y shogaol." },
                    { title: "Usos comunes", content: "Indispensable en salteados al wok, curries y jengibre encurtido para sushi. En Occidente lidera la repostería invernal. Fresco aporta notas jugosas; en polvo ofrece un picor más seco." }
                ]
            },
            {
                title: "Kashmiri Masala", flag: "🇮🇳", category: "Picante",
                introduction: "Mezcla de especias originaria de la región de Cachemira, caracterizada por su color rojo profundo y su notable suavidad.",
                sensory: { picante: 30, aromatico: 75, terroso: 50, dulce: 50 },
                sections: [
                    { title: "Origen y Geografía", content: "Proviene de la región de Cachemira, al norte de la India. Esta mezcla refleja la rica herencia cultural de un territorio que ha funcionado históricamente como un crisol de influencias." },
                    { title: "Perfil Sensorial", content: "Posee un perfil sutil que equilibra matices profundos sin una pungencia agresiva, siendo ideal para paladares sensibles. Al integrarse en curries, ayuda a desarrollar una textura cremosa." },
                    { title: "Usos comunes", content: "Se utiliza en recetas con carnes, pescados y verduras. FORMULA: Pimiento rojo Kashmiri, comino, cilantro, cúrcuma, garam masala, canela, clavo de olor y cardamomo en polvo, tostados en seco." }
                ]
            },
            {
                title: "Merkén", flag: "🇨🇱", category: "Picante",
                introduction: "Aliño tradicional elaborado a base de ají cacho de cabra seco y ahumado. Su nombre significa 'sal molida'.",

                sections: [
                    { title: "Origen y Geografía", content: "Originario de la gastronomía del pueblo mapuche en la región de la Araucanía (Chile y Argentina). Tradicionalmente se molía de forma artesanal en morteros de piedra." },
                    { title: "Perfil Sensorial", content: "Aspecto de polvo rojo con pequeñas escamas. Su sabor es ligeramente picante y marcadamente ahumado. El 'merkén especial' incorpora semillas de cilantro tostadas para aportar frescura." },
                    { title: "Usos comunes", content: "Funciona de manera excelente en platos con carnes, pescados, papas o verduras a la parrilla, e incluso en confituras. Proporción tradicional: 70% ají, 20% sal y 10% semillas de cilantro." }
                ]
            },
            {
                title: "Páprika", flag: "🇭🇺", category: "Dulce",
                introduction: "Ingrediente esencial de la cocina húngara elaborado a partir de pimientos molidos en un polvo fino y rojo vibrante.",
