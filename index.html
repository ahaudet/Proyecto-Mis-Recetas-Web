<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glosario de Especias y Recetas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@14.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-papel: #fcfbfa;
            --color-borde: #e2dacd;
            --color-texto: #2c2520;
            --color-acento: #5c1d1d;
            --color-categoria: #8c7662;
        }

        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .book-container {
            display: flex; width: 95vw; max-width: 1100px; height: 82vh; min-height: 480px;
            background-color: var(--color-papel); box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border-radius: 4px; position: relative; transition: all 0.3s ease;
        }

        .book-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent 50%, rgba(0,0,0,0.1));
            transform: translateX(-50%); pointer-events: none; z-index: 10;
        }

        .page {
            width: 50%; height: 100%; padding: 35px 40px; box-sizing: border-box;
            overflow-y: auto; display: flex; flex-direction: column;
        }

        /* Estado del libro cerrado (Portadas de capítulos) */
        .book-container.closed { max-width: 550px; }
        .book-container.closed::after { display: none; }
        .book-container.closed .page-right { display: none; }
        .book-container.closed .page-left { width: 100%; border: none; }

        .page-left { border-right: 1px solid rgba(0,0,0,0.05); }

        /* Estilos de Contenido */
        .cover-content {
            height: 100%; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; border: 2px solid var(--color-acento);
            margin: 10px; padding: 20px;
        }
        .cover-title { font-size: clamp(22pt, 4vw, 40pt); color: var(--color-acento); margin-bottom: 5px; }
        .cover-subtitle { font-size: 13pt; letter-spacing: 4px; color: var(--color-categoria); text-transform: uppercase; }

        h1 { font-size: 24pt; color: var(--color-acento); margin: 0; line-height: 1.1; }
        h2 { font-size: 11pt; text-transform: uppercase; border-bottom: 1px dashed var(--color-borde); padding-bottom: 4px; margin-top: 15px; color: var(--color-acento); }
        
        .item-image { width: 100%; max-height: 170px; object-fit: cover; border-radius: 2px; margin: 10px 0; border: 1px solid var(--color-borde); }
        p, li { font-size: 11pt; line-height: 1.5; text-align: justify; color: var(--color-texto); }
        ul, ol { padding-left: 20px; margin-top: 5px; margin-bottom: 5px; }
        li { margin-bottom: 5px; }
        
        .chef-notes { background-color: #f5efe6; border-left: 3px solid var(--color-categoria); padding: 12px; margin-top: auto; font-style: italic; font-size: 9.5pt; }

        /* ÍNDICE INTERACTIVO */
        .index-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; }
        .index-section { margin-bottom: 10px; }
        .index-section h3 { font-size: 11pt; color: var(--color-acento); text-transform: uppercase; margin: 0 0 5px 0; border-bottom: 1px solid var(--color-borde); padding-bottom: 2px; }
        .index-list { list-style: none; padding: 0; margin: 0; }
        .index-item { display: flex; justify-content: space-between; align-items: flex-end; font-size: 9.5pt; margin-bottom: 4px; cursor: pointer; color: var(--color-texto); }
        .index-item:hover { color: var(--color-acento); font-weight: bold; }
        .index-item .dots { flex-grow: 1; border-bottom: 1px dotted #aaa; margin: 0 5px; position: relative; top: -4px; }

        /* GRÁFICO SENSORIAL MINI */
        .sensory-chart { display: flex; flex-direction: column; gap: 6px; background: #fdfaf4; padding: 10px; border: 1px solid var(--color-borde); border-radius: 4px; margin-top: 10px; }
        .chart-row { display: flex; align-items: center; font-size: 9pt; }
        .chart-label { width: 70px; font-weight: bold; color: var(--color-categoria); }
        .chart-bar-container { flex-grow: 1; background: #eaddca; height: 8px; border-radius: 4px; overflow: hidden; }
        .chart-bar { background: var(--color-acento); height: 100%; border-radius: 4px; }

        /* CONTROLES */
        .nav-controls { margin-top: 15px; display: flex; gap: 15px; background: white; padding: 10px 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); align-items: center; z-index: 100; }
        .nav-btn { background: none; border: 1px solid #8c7662; color: #8c7662; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .nav-btn:hover { background: #8c7662; color: white; }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 850px) {
            .book-container { height: 78vh; min-height: 400px; }
            .page { padding: 15px 12px; }
            h1 { font-size: 14pt; }
            h2 { font-size: 9.5pt; margin-top: 8px; }
            p, li { font-size: 8.5pt; line-height: 1.3; text-align: left; }
            ul, ol { padding-left: 15px; }
            .item-image { max-height: 90px; margin: 6px 0; }
            .index-grid { grid-template-columns: 1fr; gap: 10px; }
            .index-item { font-size: 9pt; }
            .nav-controls { scale: 0.85; margin-top: 8px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 5px; }
            .book-container { height: 82vh; min-height: 240px; }
            .page { padding: 10px 15px; }
            h1 { font-size: 12pt; }
            h2 { font-size: 9pt; margin-top: 4px; }
            p, li { font-size: 8pt; line-height: 1.2; text-align: left; }
            .item-image { max-height: 55px; margin: 4px 0; }
            .nav-controls { scale: 0.75; margin-top: 4px; padding: 4px 15px; }
        }
    </style>
</head>
<body>

    <div class="book-container closed" id="book">
        <div class="page page-left" id="left-page"></div>
        <div class="page page-right" id="right-page"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goBack()">Anterior</button>
        <span id="page-indicator" style="font-size: 9pt; font-weight: bold; font-family: sans-serif;">Cargando...</span>
        <button class="nav-btn" onclick="goForward()">Siguiente</button>
    </div>

    <script>
        // BASE DE DATOS MAESTRA - 24 ESPECIAS COMPLETAS CON PERFIL SENSORIAL PARA EL GRÁFICO
        const GLOSARIO_DATA = [
            { title: "Ají Molido", flag: "🇦🇷", category: "Picante", introduction: "Fruto desecado y triturado del género Capsicum, pilar de la cocina criolla.", sensory: { picante: 60, aromatico: 40, terroso: 50, dulce: 30 }, sections: [{ title: "Origen y Geografía", content: "Noroeste Argentino (región del NOA), principalmente valles calchaquíes." }, { title: "Perfil Sensorial", content: "Picor moderado, notas sutilmente dulces y un marcado ahumado natural." }, { title: "Usos comunes", content: "Alma del chimichurri, empanadas, locro y guisados." }] },
            { title: "Anís Estrellado", flag: "🇨🇳", category: "Aromático", introduction: "Fruto seco con forma de estrella de ocho puntas obtenido de Illicium verum.", sensory: { picante: 10, aromatico: 95, terroso: 20, dulce: 80 }, sections: [{ title: "Origen", content: "Suroeste de China y norte de Vietnam." }, { title: "Perfil Sensorial", content: "Aroma licoroso, penetrante y profundamente dulce por su concentración de anetol." }] },
            { title: "Baharat", flag: "🌍", category: "Mezcla", introduction: "Mezcla cálida y terrosa fundamental en Oriente Medio y Turquía.", sensory: { picante: 40, aromatico: 80, terroso: 85, dulce: 40 }, sections: [{ title: "Origen", content: "Rutas comerciales árabes." }, { title: "Usos", content: "Ideal para carnes rojas y pescados grasos como el salmón." }] },
            { title: "Canela", flag: "🇱🇰", category: "Dulce", introduction: "Corteza interna desecada y enrollada del árbol Cinnamomum verum.", sensory: { picante: 20, aromatico: 90, terroso: 30, dulce: 95 }, sections: [{ title: "Origen", content: "Sri Lanka y sur de la India." }, { title: "Perfil", content: "Color pardo rojizo, perfume dulce y amaderado persistente." }] },
            { title: "Cardamomo", flag: "🇮🇳", category: "Herbal", introduction: "Semilla aromática de la familia del jengibre, exótica y sofisticada.", sensory: { picante: 30, aromatico: 95, terroso: 10, dulce: 60 }, sections: [{ title: "Origen", content: "Selvas de la India meridional y gran producción en Guatemala." }, { title: "Perfil", content: "Cítrico, fresco y mentolado." }] },
            { title: "Cayena", flag: "🇬🇫", category: "Picante", introduction: "Polvo obtenido del secado y molienda de chiles Capsicum annuum.", sensory: { picante: 95, aromatico: 20, terroso: 30, dulce: 10 }, sections: [{ title: "Origen", content: "Guayana Francesa y América Central." }, { title: "Perfil", content: "Picor agudo y directo provocado por la capsaicina pura." }] },
            { title: "Cilantro", flag: "🌍", category: "Herbal", introduction: "Hierba anual fresca de aroma cítrico y vibrante.", sensory: { picante: 0, aromatico: 85, terroso: 10, dulce: 20 }, sections: [{ title: "Propiedades", content: "Aporta frescura inmediata al romper sus hojas al final." }] },
            { title: "Clavo de Olor", flag: "🇮🇩", category: "Dulce", introduction: "Botón floral seco del Syzygium aromaticum, extremadamente potente.", sensory: { picante: 50, aromatico: 95, terroso: 40, dulce: 70 }, sections: [{ title: "Componente", content: "Contiene hasta un 90% de eugenol puro." }] },
            { title: "Comino", flag: "🇪🇬", category: "Picante", introduction: "Semilla seca indispensable de trasfondo marcadamente terroso.", sensory: { picante: 40, aromatico: 75, terroso: 95, dulce: 10 }, sections: [{ title: "Origen", content: "Mediterráneo Oriental. Clave en la empanada criolla y humitas." }] },
            { title: "Coriandro", flag: "🌍", category: "Herbal", introduction: "Semilla redonda beige de la planta del cilantro; notas cítricas secas.", sensory: { picante: 10, aromatico: 70, terroso: 40, dulce: 50 }, sections: [{ title: "Perfil", content: "Notas de limón y nuez tostada." }] },
            { title: "Curry", flag: "🇮🇳", category: "Mezcla", introduction: "Combinación de especias de arquitectura compleja y profundamente aromática.", sensory: { picante: 50, aromatico: 90, terroso: 70, dulce: 30 }, sections: [{ title: "Composición", content: "Base de cilantro, cúrcuma, comino y alholva." }] },
            { title: "Garam Masala", flag: "🇮🇳", category: "Mezcla", introduction: "Mezcla caliente del norte de la India sin cúrcuma aromática.", sensory: { picante: 30, aromatico: 90, terroso: 60, dulce: 40 }, sections: [{ title: "Uso", content: "Se añade al final para mantener aceites esenciales." }] },
            { title: "Jengibre", flag: "🇮🇳", category: "Herbal", introduction: "Rizoma subterráneo picante, refrescante y muy cítrico.", sensory: { picante: 70, aromatico: 85, terroso: 20, dulce: 40 }, sections: [{ title: "Química", content: "El gingerol fresco muta a zingerona al cocinarse." }] },
            { title: "Kashmiri Masala", flag: "🇮🇳", category: "Picante", introduction: "Mezcla de la región de Cachemira, famosa por su rojo vibrante y suavidad.", sensory: { picante: 30, aromatico: 75, terroso: 50, dulce: 50 }, sections: [{ title: "Cualidad", content: "Da color profundo sin agredir el paladar." }] },
            { title: "Merkén", flag: "🇨🇱", category: "Picante", introduction: "Aliño tradicional mapuche a base de ají cacho de cabra ahumado y sal.", sensory: { picante: 65, aromatico: 50, terroso: 80, dulce: 20 }, sections: [{ title: "Detalle", content: "La variedad especial lleva semillas de coriandro." }] },
            { title: "Páprika", flag: "🇭🇺", category: "Dulce", introduction: "Pilar de la cocina húngara hecho de pimientos dulces molidos finos.", sensory: { picante: 20, aromatico: 60, terroso: 40, dulce: 80 }, sections: [{ title: "Uso", content: "Esencial para el Goulash y embutidos artesanales." }] },
            { title: "Pimienta Blanca", flag: "🇮🇳", category: "Picante", introduction: "Semilla madura sin pericarpio de Piper nigrum. Picor limpio.", sensory: { picante: 80, aromatico: 40, terroso: 60, dulce: 0 }, sections: [{ title: "Estética", content: "Ideal para salsas claras como la bechamel." }] },
            { title: "Pimienta Negra", flag: "🇮🇳", category: "Picante", introduction: "Baya entera deshidratada considerada la reina de las especias mundiales.", sensory: { picante: 75, aromatico: 80, terroso: 50, dulce: 10 }, sections: [{ title: "Técnica", content: "Se debe moler al instante para no perder piperina." }] },
            { title: "Pimienta Verde", flag: "🇮🇳", category: "Herbal", introduction: "Baya inmadura preservada en salmuera de perfil herbal y fresco.", sensory: { picante: 40, aromatico: 85, terroso: 30, dulce: 20 }, sections: [{ title: "Uso", content: "Clásica en salsas cremosas con cognac para carnes." }] },
            { title: "Pimienta Rosa", flag: "🇦🇷🇧🇷", introduction: "Bayas del árbol Aguaribay. Resinosa, frutal y dulce.", sensory: { picante: 15, aromatico: 90, terroso: 20, dulce: 70 }, category: "Aromático", sections: [{ title: "Nota Botánica", content: "El Aguaribay es nativo de Argentina y la región andina." }] },
            { title: "Ras el Hanout", flag: "🇲🇦", category: "Mezcla", introduction: "Mezcla compleja de Marruecos que significa 'lo mejor de la tienda'.", sensory: { picante: 40, aromatico: 95, terroso: 70, dulce: 50 }, sections: [{ title: "Complejidad", content: "Llega a tener más de 30 ingredientes aromáticos." }] },
            { title: "Shichimi Togarashi", flag: "🇯🇵", category: "Picante", introduction: "Siete sabores en una mezcla japonesa cítrica y con alga nori.", sensory: { picante: 70, aromatico: 70, terroso: 40, dulce: 20 }, sections: [{ title: "Toque", content: "Lleva chile, piel de naranja y sésamo." }] },
            { title: "Sumaque", flag: "🇹🇷", category: "Aromático", introduction: "Bayas deshidratadas molidas de Rhus coriaria. Aporta acidez pura.", sensory: { picante: 10, aromatico: 80, terroso: 30, dulce: 40 }, sections: [{ title: "Sabor", content: "Sustituto perfecto del limón en polvo seco." }] },
            { title: "Tahini", flag: "🇱🇧", category: "Mezcla", introduction: "Pasta oleosa fluida de semillas de sésamo molidas libanesas.", sensory: { picante: 0, aromatico: 60, terroso: 75, dulce: 30 }, sections: [{ title: "Uso", content: "Base indispensable para el hummus y baba ganoush." }] },
            { title: "Z'atar", flag: "🇱🇧", category: "Mezcla", introduction: "Mezcla de tomillo silvestre, sumaque y sésamo del Levante.", sensory: { picante: 10, aromatico: 90, terroso: 70, dulce: 30 }, sections: [{ title: "Tradición", content: "Se consume combinado con aceite de oliva y pan plano." }] },
            { title: "Cúrcuma", flag: "🇮🇳", category: "Aromático", introduction: "Rizoma dorado de la familia del jengibre, intensamente terroso.", sensory: { picante: 20, aromatico: 65, terroso: 90, dulce: 20 }, sections: [{ title: "Cualidad", content: "Aporta color amarillo brillante y fondo almizclado." }] },
            { title: "Locoto", flag: "🇧🇴", category: "Picante", introduction: "Capsicum pubescens de semillas negras y pulpa sumamente jugosa.", sensory: { picante: 95, aromatico: 50, terroso: 20, dulce: 40 }, sections: [{ title: "Uso", content: "Columna de la llajua boliviana tradicional." }] }
        ];

        // DATOS DE RECETAS ORGANIZADAS POR TUS CATEGORÍAS EXACTAS
        let recetasRaw = [];
        let paginasLineales = []; // Aquí se guardará la paginación real mapeada paso a paso
        let currentIndex = 0;

        const CATEGORIAS = ["Dips", "Entradas", "Plato principal", "Conservas", "Acompañamientos", "Dulces", "Postres", "Glosario"];

        function loadRecipesDatabase() {
            fetch('recetas.json')
                .then(response => response.json())
                .then(data => { recetasRaw = data; buildBookStructure(); })
                .catch(() => {
                    // Fallback de desarrollo por si no encuentra el archivo local
                    recetasRaw = [
                        { title: "Chimichurri Casero", category: "Dips", ingredients: ["Ají molido", "Orégano", "Ajo", "Aceite", "Vinagre"], instructions: "Mezclar los secos, hidratar con agua tibia, sumar vinagre y terminar con aceite.", authorComments: "Dejar reposar 24 hs." },
                        { title: "Empanada Gallega", category: "Entradas", ingredients: ["Masa hojaldre", "Caballa 1 lata", "Cebolla", "Pimiento"], instructions: "Rehogar vegetales, sumar pescado, rellenar y hornear 180°C por 30 min.", authorComments: "Ideal comer fría." },
                        { title: "Asado de Tira", category: "Plato principal", ingredients: ["Asado de tira", "Sal parrillera"], instructions: "Llevar a la parrilla con buena brasa, 40 min del lado del hueso, 20 del otro.", authorComments: "Fuego constante." }
                    ];
                    buildBookStructure();
                });
        }

        // CONSTRUCCIÓN DEL MAPA DE PÁGINAS DEL LIBRO (Índice dinámico y capítulos)
        function buildBookStructure() {
            paginasLineales = [];
            
            // 1. Página de Portada Principal
            paginasLineales.push({ type: 'PORTADA_PRINCIPAL' });
            
            // 2. Página del Índice General
            paginasLineales.push({ type: 'INDICE' });

            // Recorremos cada categoría aprobada
            CATEGORIAS.forEach(cat => {
                if (cat === "Glosario") {
                    // Portada del Glosario
                    paginasLineales.push({ type: 'PORTADA_CAPITULO', title: "Glosario de Especias", subtitle: "Anexo Técnico" });
                    // Páginas de especias (de a 1 por pantalla doble)
                    GLOSARIO_DATA.forEach((spice, idx) => {
                        paginasLineales.push({ type: 'GLOSARIO_ITEM', data: spice, index: idx });
                    });
                } else {
                    const deEstaCat = recetasRaw.filter(r => r.category && r.category.toLowerCase() === cat.toLowerCase());
                    if (deEstaCat.length > 0) {
                        // Portada del Capítulo
                        paginasLineales.push({ type: 'PORTADA_CAPITULO', title: cat, subtitle: "Capítulo" });
                        // Sus recetas
                        deEstaCat.forEach(receta => {
                            paginasLineales.push({ type: 'RECETA_ITEM', data: receta });
                        });
                    }
                }
            });

            render();
        }

        function render() {
            const book = document.getElementById('book');
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            const p = paginasLineales[currentIndex];
            if (!p) return;

            // Reset de vistas
            book.classList.remove('closed');
            left.innerHTML = ''; right.innerHTML = '';

            if (p.type === 'PORTADA_PRINCIPAL') {
                book.classList.add('closed');
                left.innerHTML = `
                    <div class="cover-content">
                        <div class="cover-subtitle">Libro Gastronómico</div>
                        <h1 class="cover-title">Mis Recetas</h1>
                        <div class="cover-subtitle" style="margin-top:30px; font-size:10pt;">Y Glosario de Especias</div>
                        <div style="margin-top:50px; font-style:italic; color: var(--color-categoria);">Por Alejandro Haudet</div>
                    </div>`;
                indicator.innerText = "PORTADA";
            } 
            
            else if (p.type === 'INDICE') {
                // El índice es a doble página obligatoria
                left.innerHTML = `<h1>Índice General</h1><div class="metadata-line">Tabla de contenidos interactiva</div><div class="index-grid" id="idx-l"></div>`;
                right.innerHTML = `<div class="metadata-line" style="text-align:right">Estructura Editorial</div><div class="index-grid" id="idx-r"></div>`;
                
                setTimeout(() => {
                    const idxL = document.getElementById('idx-l');
                    const idxR = document.getElementById('idx-r');
                    
                    CATEGORIAS.forEach((cat, index) => {
                        const targetContainer = index < 4 ? idxL : idxR;
                        let targetIndex = paginasLineales.findIndex(page => page.type === 'PORTADA_CAPITULO' && page.title.toLowerCase() === cat.toLowerCase());
                        if(cat === "Glosario") targetIndex = paginasLineales.findIndex(page => page.type === 'PORTADA_CAPITULO' && page.title.includes("Glosario"));

                        if (targetIndex !== -1) {
                            const secDiv = document.createElement('div');
                            secDiv.className = 'index-section';
                            secDiv.innerHTML = `<h3>${cat}</h3>`;
                            const ul = document.createElement('ul');
                            ul.className = 'index-list';

                            if (cat === "Glosario") {
                                const li = document.createElement('li');
                                li.className = 'index-item';
                                li.onclick = () => jumpToPage(targetIndex);
                                li.innerHTML = `<span>Ver las 24 Especias</span><span class="dots"></span><span>pag</span>`;
                                ul.appendChild(li);
                            } else {
                                const deEstaCat = recetasRaw.filter(r => r.category && r.category.toLowerCase() === cat.toLowerCase());
                                deEstaCat.forEach(r => {
                                    const rIdx = paginasLineales.findIndex(page => page.type === 'RECETA_ITEM' && page.data.title === r.title);
                                    const li = document.createElement('li');
                                    li.className = 'index-item';
                                    li.onclick = () => jumpToPage(rIdx);
                                    li.innerHTML = `<span>${r.title}</span><span class="dots"></span><span>👉</span>`;
                                    ul.appendChild(li);
                                });
                            }
                            secDiv.appendChild(ul);
                            targetContainer.appendChild(secDiv);
                        }
                    });
                }, 10);
                indicator.innerText = "ÍNDICE";
            }

            else if (p.type === 'PORTADA_CAPITULO') {
                book.classList.add('closed');
                left.innerHTML = `
                    <div class="cover-content" style="border-color: var(--color-categoria)">
                        <div class="cover-subtitle">${p.subtitle}</div>
                        <h1 class="cover-title" style="color: var(--color-texto);">${p.title}</h1>
                    </div>`;
                indicator.innerText = `SECCIÓN: ${p.title.toUpperCase()}`;
            }

            else if (p.type === 'RECETA_ITEM') {
                const r = p.data;
                const finalImgPath = r.image ? (r.image.includes('/') ? r.image : `fotos-receta/${r.image}`) : '';
                left.innerHTML = `
                    <div class="cover-subtitle" style="font-size:8.5pt;">${r.category}</div>
                    <h1>${r.title}</h1>
                    ${finalImgPath ? `<img src="${finalImgPath}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <h2>Ingredientes</h2>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
                
                right.innerHTML = `
                    <h2>Preparación</h2>
                    <ol>${r.instructions.split(',').map(paso => `<li>${paso.trim()}</li>`).join('')}</ol>
                    ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}`;
                indicator.innerText = `RECETA`;
            }

            else if (p.type === 'GLOSARIO_ITEM') {
                const e = p.data;
                left.innerHTML = `
                    <div class="cover-subtitle" style="font-size:8.5pt;">Mapeo Botánico</div>
                    <h1>${e.title} <span class="flag-emoji">${e.flag}</span></h1>
                    <h2>Perfil: ${e.category}</h2>
                    <p><em>${e.introduction}</em></p>
                    
                    <h2>Gráfico Sensorial</h2>
                    <div class="sensory-chart">
                        <div class="chart-row"><span class="chart-label">Picante</span><div class="chart-bar-container"><div class="chart-bar" style="width:${e.sensory.picante}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Aromático</span><div class="chart-bar-container"><div class="chart-bar" style="width:${e.sensory.aromatico}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Terroso</span><div class="chart-bar-container"><div class="chart-bar" style="width:${e.sensory.terroso}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Dulce</span><div class="chart-bar-container"><div class="chart-bar" style="width:${e.sensory.dulce}%"></div></div></div>
                    </div>`;

                let secHtml = e.sections ? e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('') : '';
                right.innerHTML = `<h2>Análisis Técnico</h2>${secHtml}`;
                indicator.innerText = `ESPECIA ${p.index + 1} / ${GLOSARIO_DATA.length}`;
            }

            twemoji.parse(document.body);
        }

        function goForward() { if (currentIndex < paginasLineales.length - 1) { currentIndex++; render(); } }
        function goBack() { if (currentIndex > 0) { currentIndex--; render(); } }
        function jumpToPage(pageIndex) { if (pageIndex >= 0 && pageIndex < paginasLineales.length) { currentIndex = pageIndex; render(); } }

        document.addEventListener('DOMContentLoaded', loadRecipesDatabase);
    </script>
</body>
</html>
