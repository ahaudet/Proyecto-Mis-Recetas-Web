<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Glosario de Especias y Libro de Cocina</title>
    <style>
        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .book-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 650px;
            background-color: #fcfbfa;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        .book-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0) 50%, rgba(0,0,0,0.15));
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .page {
            width: 50%;
            padding: 45px 50px;
            box-sizing: border-box;
            background-color: #fcfbfa;
            overflow-y: auto;
        }
        .page-left {
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .page-right {
            border-left: 1px solid rgba(0,0,0,0.05);
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .section-tag {
            font-family: 'Arial', sans-serif;
            font-size: 8.5pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8c7662;
            margin-bottom: 10px;
            font-weight: bold;
        }
        h1 {
            font-size: 26pt;
            color: #5c1d1d;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: normal;
            line-height: 1.2;
        }
        .metadata-line {
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a6855;
            border-bottom: 1px solid #e2dacd;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5c1d1d;
            margin-top: 15px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #e2dacd;
            padding-bottom: 4px;
        }
        p, li {
            color: #2c2520;
            line-height: 1.6;
            font-size: 11pt;
            text-align: justify;
        }
        ul, ol {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        li {
            margin-bottom: 6px;
        }
        .specie-box {
            background-color: #f7f3ed;
            border: 1px solid #e2dacd;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 10pt;
        }
        .specie-box table {
            width: 100%;
            border-collapse: collapse;
        }
        .specie-box td {
            padding: 4px 6px;
            vertical-align: top;
        }
        .specie-box .label {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: #8c7662;
            width: 35%;
        }
        .chef-notes {
            background-color: #f5efe6;
            border-left: 3px solid #8c7662;
            padding: 12px 15px;
            margin-top: auto;
            font-style: italic;
            font-size: 10.5pt;
        }
        .nav-controls {
            display: flex;
            gap: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            align-items: center;
        }
        .nav-btn {
            background: none;
            border: 1px solid #8c7662;
            color: #8c7662;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background-color: #8c7662;
            color: white;
        }
        @media (max-width: 850px) {
            .book-container {
                flex-direction: column;
                min-height: auto;
            }
            .book-container::after {
                display: none;
            }
            .page {
                width: 100%;
                padding: 30px 25px;
            }
            .page-left {
                border-right: none;
                border-bottom: 1px dashed #e2dacd;
            }
            .page-right {
                padding-left: 25px;
                border-left: none;
            }
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="page page-left" id="left-page-content"></div>
        <div class="page page-right" id="right-page-content"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goToPrev()">← Anterior</button>
        <span id="page-indicator" style="font-family: Arial, sans-serif; color: #666; font-size: 10pt; font-weight: bold;">Cargando...</span>
        <button class="nav-btn" onclick="goToNext()">Siguiente →</button>
    </div>

    <script>
        let bookData = {
            recetas: [],
            glosario: []
        };
        
        let currentSection = 'recetas';
        let currentIndex = 0;

        async function loadBookData() {
            try {
                const [resRecetas, resEspecias] = await Promise.all([
                    fetch('/Proyecto-Libro-de-recetas/recetas.json'),
                    fetch('/Proyecto-Libro-de-recetas/especias.json')
                ]);

                const datosRecetas = await resRecetas.json();
                const datosEspecias = await resEspecias.json();

                // Asignamos según tu estructura en inglés real
                bookData.recetas = Array.isArray(datosRecetas) ? datosRecetas : (datosRecetas.recetas || []);
                bookData.glosario = Array.isArray(datosEspecias) ? datosEspecias : (datosEspecias.glosario || datosEspecias.especias || []);
                
                renderPage();
            } catch (error) {
                console.error("Error al cargar los archivos JSON:", error);
                document.getElementById('page-indicator').innerText = "Error al conectar con las bases de datos";
            }
        }

        function renderPage() {
            const leftPage = document.getElementById('left-page-content');
            const rightPage = document.getElementById('right-page-content');
            const indicator = document.getElementById('page-indicator');

            if (bookData.recetas.length === 0 && bookData.glosario.length === 0) {
                leftPage.innerHTML = "<h1>Sin Contenido</h1><p>Verificá que los archivos JSON tengan datos válidos.</p>";
                rightPage.innerHTML = "";
                return;
            }

            if (currentSection === 'recetas') {
                const receta = bookData.recetas[currentIndex];
                if (!receta) return;

                // Mapeo exacto de tus claves detectadas
                const titulo = receta.title || "Receta sin título";
                const categoria = receta.category || "General";
                const ingredientes = receta.ingredients || [];
                const autorComentarios = receta.authorComments || "";
                
                // Procesamos las instrucciones separadas por coma para convertirlas en una lista ordenada limpia
                let pasosHtml = "";
                if (receta.instructions) {
                    const pasosArray = receta.instructions.split(',');
                    pasosHtml = `<ol>${pasosArray.map(paso => `<li>${paso.trim()}</li>`).join('')}</ol>`;
                } else {
                    pasosHtml = "<p>Procedimiento no especificado.</p>";
                }

                leftPage.innerHTML = `
                    <div class="section-tag">Capítulo I • El Recetario</div>
                    <h1>${titulo}</h1>
                    <div class="metadata-line">Categoría: ${categoria}</div>
                    <h2>Ingredientes Requeridos</h2>
                    <ul>
                        ${ingredientes.map(ing => `<li>${ing}</li>`).join('')}
                    </ul>
                `;

                rightPage.innerHTML = `
                    <div class="metadata-line" style="text-align: right;">Ficha Técnica</div>
                    <h2>Procedimiento de Elaboración</h2>
                    <div class="steps-box">${pasosHtml}</div>
                    ${autorComentarios ? `<div class="chef-notes"><strong>Notas Técnicas del Autor:</strong> ${autorComentarios}</div>` : ''}
                `;

                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;

            } else if (currentSection === 'glosario') {
                const especia = bookData.glosario[currentIndex];
                if (!especia) return;

                // Mapeo exacto de tus claves del glosario
                const nombreEspecia = especia.title || "Especia";
                const bandera = especia.flag || "";
                const categoriaEspecia = especia.category || "Condimento";
                const introduccion = especia.introduction || "";
                const secciones = especia.sections || [];

                leftPage.innerHTML = `
                    <div class="section-tag">Anexo Técnico • Glosario de Especias</div>
                    <h1>${nombreEspecia} ${bandera}</h1>
                    <div class="metadata-line">Perfil: ${categoriaEspecia}</div>
                    
                    <h2>Introducción Genérica</h2>
                    <p><em>${introduccion}</em></p>
                    
                    <div class="specie-box">
                        <table>
                            <tr>
                                <td class="label">Identificador Técnico:</td>
                                <td><code>${especia.id || 'N/A'}</code></td>
                            </tr>
                        </table>
                    </div>
                `;

                // Renderizamos las secciones dinámicas del array "sections" en la página derecha
                let seccionesHtml = `<div class="metadata-line" style="text-align: right;">Análisis de Componentes</div>`;
                if (secciones.length > 0) {
                    seccionesHtml += secciones.map(sec => `
                        <h2>${sec.title}</h2>
                        <p>${sec.content}</p>
                    `).join('');
                } else {
                    seccionesHtml += "<p>No hay secciones detalladas para esta especia.</p>";
                }

                rightPage.innerHTML = seccionesHtml;

                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }
        }

        function goToNext() {
            if (currentSection === 'recetas') {
                if (currentIndex < bookData.recetas.length - 1) {
                    currentIndex++;
                } else if (bookData.glosario && bookData.glosario.length > 0) {
                    currentSection = 'glosario';
                    currentIndex = 0;
                }
            } else if (currentSection === 'glosario') {
                if (currentIndex < bookData.glosario.length - 1) {
                    currentIndex++;
                }
            }
            renderPage();
        }

        function goToPrev() {
            if (currentSection === 'glosario') {
                if (currentIndex > 0) {
                    currentIndex--;
                } else if (bookData.recetas && bookData.recetas.length > 0) {
                    currentSection = 'recetas';
                    currentIndex = bookData.recetas.length - 1;
                }
            } else if (currentSection === 'recetas') {
                if (currentIndex > 0) {
                    currentIndex--;
                }
            }
            renderPage();
        }

        window.onload = loadBookData;
    </script>
</body>
</html>
