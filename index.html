<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Recetas y Especias - Edición Editorial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@14.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-papel: #fcfbfa;
            --color-borde: #e2dacd;
            --color-texto: #2c2520;
            --color-acento: #5c1d1d;
            --color-categoria: #8c7662;
        }

        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .book-container {
            display: flex; width: 95vw; max-width: 1150px; height: 84vh; min-height: 500px;
            background-color: var(--color-papel); box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border-radius: 4px; position: relative; transition: all 0.3s ease;
        }

        .book-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent 50%, rgba(0,0,0,0.1));
            transform: translateX(-50%); pointer-events: none; z-index: 10;
        }

        .page {
            width: 50%; height: 100%; padding: 35px 40px; box-sizing: border-box;
            overflow-y: auto; display: flex; flex-direction: column;
        }

        .book-container.closed { max-width: 575px; }
        .book-container.closed::after { display: none; }
        .book-container.closed .page-right { display: none; }
        .book-container.closed .page-left { width: 100%; border: none; }

        .page-left { border-right: 1px solid rgba(0,0,0,0.05); }

        /* Cabeceras de Página y Retornos Nav */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .return-link { font-family: Arial, sans-serif; font-size: 8.5pt; color: var(--color-acento); text-decoration: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .return-link:hover { text-decoration: underline; color: var(--color-categoria); }

        .cover-content {
            height: 100%; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; border: 2px solid var(--color-acento);
            margin: 10px; padding: 25px; position: relative;
        }
        .cover-title { font-size: clamp(22pt, 4vw, 40pt); color: var(--color-acento); margin-bottom: 5px; font-weight: normal; }
        .cover-subtitle { font-size: 13pt; letter-spacing: 4px; color: var(--color-categoria); text-transform: uppercase; }

        h1 { font-size: 24pt; color: var(--color-acento); margin: 0; line-height: 1.1; font-weight: normal; }
        h2 { font-size: 10.5pt; text-transform: uppercase; border-bottom: 1px dashed var(--color-borde); padding-bottom: 4px; margin-top: 15px; color: var(--color-acento); letter-spacing: 1px; }
        
        .item-image { width: 100%; max-height: 170px; object-fit: cover; border-radius: 2px; margin: 10px 0; border: 1px solid var(--color-borde); }
        p, li { font-size: 10.5pt; line-height: 1.5; text-align: left; color: var(--color-texto); }
        ul, ol { padding-left: 20px; margin-top: 5px; margin-bottom: 5px; }
        li { margin-bottom: 5px; }
        
        .chef-notes { background-color: #f5efe6; border-left: 3px solid var(--color-categoria); padding: 12px; margin-top: auto; font-style: italic; font-size: 9.5pt; }

        /* DISEÑO ESTRUCTURADO DEL ÍNDICE GENERAL */
        .index-container { width: 100%; display: flex; flex-direction: column; gap: 25px; margin-top: 15px; }
        .index-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; width: 100%; }
        .index-section { display: flex; flex-direction: column; }
        .index-section h3 { font-size: 10pt; color: var(--color-acento); text-transform: uppercase; margin: 0 0 8px 0; border-bottom: 2px solid var(--color-categoria); padding-bottom: 3px; letter-spacing: 1px; }
        .index-list { list-style: none; padding: 0; margin: 0; }
        .index-item { display: flex; justify-content: space-between; align-items: flex-end; font-size: 9pt; margin-bottom: 6px; cursor: pointer; color: var(--color-texto); line-height: 1.2; }
        .index-item:hover { color: var(--color-acento); font-weight: bold; }
        .index-item .dots { flex-grow: 1; border-bottom: 1px dotted #aaa; margin: 0 5px; position: relative; top: -3px; }

        /* ÍNDICE DE LAS ESPECIAS */
        .glossary-index-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; width: 100%; margin-top: 15px; }

        /* GRÁFICO SENSORIAL */
        .sensory-chart { display: flex; flex-direction: column; gap: 6px; background: #fdfaf4; padding: 10px; border: 1px solid var(--color-borde); border-radius: 4px; margin-top: 10px; }
        .chart-row { display: flex; align-items: center; font-size: 9pt; }
        .chart-label { width: 70px; font-weight: bold; color: var(--color-categoria); }
        .chart-bar-container { flex-grow: 1; background: #eaddca; height: 8px; border-radius: 4px; overflow: hidden; }
        .chart-bar { background: var(--color-acento); height: 100%; border-radius: 4px; }

        /* CONTROLES NAVEGACIÓN */
        .nav-controls { margin-top: 15px; display: flex; gap: 15px; background: white; padding: 10px 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); align-items: center; z-index: 100; }
        .nav-btn { background: none; border: 1px solid #8c7662; color: #8c7662; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .nav-btn:hover { background: #8c7662; color: white; }

        /* RESPONSIVE MÓVIL OPTIMIZADO */
        @media (max-width: 850px) {
            .book-container { height: 78vh; min-height: 400px; }
            .page { padding: 15px 12px; }
            h1 { font-size: 14pt; }
            h2 { font-size: 9.5pt; margin-top: 8px; }
            p, li { font-size: 8.5pt; line-height: 1.3; text-align: left; }
            ul, ol { padding-left: 15px; }
            .item-image { max-height: 90px; margin: 6px 0; }
            .index-row { grid-template-columns: 1fr; gap: 15px; }
            .glossary-index-grid { grid-template-columns: 1fr; gap: 6px; }
            .nav-controls { scale: 0.85; margin-top: 8px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 5px; }
            .book-container { height: 82vh; min-height: 240px; }
            .page { padding: 10px 15px; }
            h1 { font-size: 12pt; }
            h2 { font-size: 9pt; margin-top: 4px; }
            p, li { font-size: 8pt; line-height: 1.2; text-align: left; }
            .item-image { max-height: 55px; margin: 4px 0; }
            .nav-controls { scale: 0.75; margin-top: 4px; padding: 4px 15px; }
        }
    </style>
</head>
<body>

    <div class="book-container closed" id="book">
        <div class="page page-left" id="left-page"></div>
        <div class="page page-right" id="right-page"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goBack()">Anterior</button>
        <span id="page-indicator" style="font-size: 9pt; font-weight: bold; font-family: sans-serif;">Cargando...</span>
        <button class="nav-btn" onclick="goForward()">Siguiente</button>
    </div>

    <script>
        let recetasRaw = [];
        let GLOSARIO_DATA = [];
        let paginasLineales = [];
        let currentIndex = 0;

        const CATEGORIAS_PAGE_1 = ["Dips", "Entradas", "Plato principal", "Conservas"];
        const CATEGORIAS_PAGE_2 = ["Acompañamientos", "Dulces", "Postres"];

        function loadBookDatabases() {
            Promise.all([
                fetch('recetas.json').then(response => {
                    if (!response.ok) throw new Error('Error al leer recetas.json');
                    return response.json();
                }),
                fetch('especias.json').then(response => {
                    if (!response.ok) throw new Error('Error al leer especias.json');
                    return response.json();
                })
            ])
            .then(([recetasData, especiasData]) => {
                recetasRaw = recetasData;
                GLOSARIO_DATA = especiasData;
                buildBookStructure();
            })
            .catch(error => {
                console.error(error);
                document.getElementById('page-indicator').innerText = "Error al sincronizar archivos JSON";
            });
        }

        function buildBookStructure() {
            paginasLineales = [];
            
            paginasLineales.push({ type: 'PORTADA_PRINCIPAL' });
            paginasLineales.push({ type: 'INDICE_GENERAL' });

            const todasLasCategorias = [...CATEGORIAS_PAGE_1, ...CATEGORIAS_PAGE_2];
            todasLasCategorias.forEach(cat => {
                const deEstaCat = recetasRaw.filter(r => r.category && r.category.toLowerCase() === cat.toLowerCase());
                if (deEstaCat.length > 0) {
                    paginasLineales.push({ type: 'PORTADA_CAPITULO', title: cat, subtitle: "Capítulo" });
                    deEstaCat.forEach(receta => {
                        paginasLineales.push({ type: 'RECETA_ITEM', data: receta });
                    });
                }
            });

            paginasLineales.push({ type: 'PORTADA_CAPITULO', title: "Las Especias", subtitle: "Anexo Técnico" });
            paginasLineales.push({ type: 'INDICE_GLOSARIO' });

            GLOSARIO_DATA.forEach((spice, idx) => {
                paginasLineales.push({ type: 'GLOSARIO_ITEM', data: spice, index: idx });
            });

            render();
        }

        function render() {
            const book = document.getElementById('book');
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            const p = paginasLineales[currentIndex];
            if (!p) return;

            book.classList.remove('closed');
            left.innerHTML = ''; right.innerHTML = '';

            const idxGeneralPos = paginasLineales.findIndex(page => page.type === 'INDICE_GENERAL');
            const idxGlosarioPos = paginasLineales.findIndex(page => page.type === 'INDICE_GLOSARIO');

            if (p.type === 'PORTADA_PRINCIPAL') {
                book.classList.add('closed');
                left.innerHTML = `
                    <div class="cover-content">
                        <div class="cover-subtitle">Libro Editorial Gastronómico</div>
                        <h1 class="cover-title">Mis Recetas</h1>
                        <div class="cover-subtitle" style="margin-top:25px; font-size:10pt;">& Las Especias</div>
                        <div style="margin-top:50px; font-style:italic; color: var(--color-categoria);">Por Alejandro Haudet</div>
                    </div>`;
                indicator.innerText = "PORTADA";
            } 
            
            else if (p.type === 'INDICE_GENERAL') {
                left.innerHTML = `
                    <div class="page-header"><h1>Índice General</h1></div>
                    <div class="index-container"><div class="index-row" id="idx-l"></div></div>`;
                
                right.innerHTML = `
                    <div class="page-header"><span class="return-link" style="visibility:hidden">.</span></div>
                    <div class="index-container">
                        <div class="index-row" id="idx-r"></div>
                        <div class="index-section" style="margin-top:15px;">
                            <h3>Las Especias</h3>
                            <ul class="index-list">
                                <li class="index-item" onclick="jumpToPage(${idxGlosarioPos})"><span>Índice de Especias (${GLOSARIO_DATA.length} Variedades)</span><span class="dots"></span><span>👉</span></li>
                            </ul>
                        </div>
                    </div>`;
                
                setTimeout(() => {
                    const idxL = document.getElementById('idx-l');
                    const idxR = document.getElementById('idx-r');
                    CATEGORIAS_PAGE_1.forEach(cat => renderCategoryInIndex(cat, idxL));
                    CATEGORIAS_PAGE_2.forEach(cat => renderCategoryInIndex(cat, idxR));
                }, 10);

                indicator.innerText = "ÍNDICE GENERAL";
            }

            else if (p.type === 'PORTADA_CAPITULO') {
                book.classList.add('closed');
                let isEspecias = p.title.toLowerCase().includes("especias");
                left.innerHTML = `
                    <div class="cover-content" style="border-color: var(--color-categoria)">
                        ${isEspecias ? `<a class="return-link" onclick="jumpToPage(${idxGeneralPos})" style="position:absolute; top:20px;">← Volver al Índice General</a>` : ''}
                        <div class="cover-subtitle">${p.subtitle}</div>
                        <h1 class="cover-title">${p.title}</h1>
                    </div>`;
                indicator.innerText = p.title.toUpperCase();
            }

            else if (p.type === 'RECETA_ITEM') {
                const r = p.data;
                const finalImgPath = r.image ? (r.image.includes('/') ? r.image : `fotos-receta/${r.image}`) : '';
                
                left.innerHTML = `
                    <div class="page-header">
                        <span class="cover-subtitle" style="font-size:8.5pt;">${r.category}</span>
                        <a class="return-link" onclick="jumpToPage(${idxGeneralPos})">← Índice Gral</a>
                    </div>
                    <h1>${r.title}</h1>
                    ${finalImgPath ? `<img src="${finalImgPath}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <h2>Ingredientes</h2>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
                
                right.innerHTML = `
                    <div class="page-header"><span class="cover-subtitle" style="font-size:8.5pt; margin-left:auto;">Preparación</span></div>
                    <ol>${r.instructions.split(',').map(paso => `<li>${paso.trim()}</li>`).join('')}</ol>
                    ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}`;
                indicator.innerText = `RECETA`;
            }

            else if (p.type === 'INDICE_GLOSARIO') {
                left.innerHTML = `
                    <div class="page-header">
                        <h1>Índice de Especias</h1>
                        <a class="return-link" onclick="jumpToPage(${idxGeneralPos})">← Índice Gral</a>
                    </div>
                    <p style="font-style:italic; font-size:9.5pt; margin-bottom:15px;">Estudio analítico de tus variedades botánicas y perfiles sensoriales.</p>
                    <div class="glossary-index-grid" id="gl-idx-l"></div>`;

                right.innerHTML = `
                    <div class="page-header"><span class="return-link" style="visibility:hidden">.</span></div>
                    <div class="glossary-index-grid" id="gl-idx-r" style="margin-top:40px;"></div>`;

                setTimeout(() => {
                    const glL = document.getElementById('gl-idx-l');
                    const glR = document.getElementById('gl-idx-r');

                    GLOSARIO_DATA.forEach((spice, index) => {
                        const targetGrid = index < Math.ceil(GLOSARIO_DATA.length / 2) ? glL : glR;
                        const sIdx = paginasLineales.findIndex(page => page.type === 'GLOSARIO_ITEM' && page.data.title === spice.title);
                        
                        const li = document.createElement('div');
                        li.className = 'index-item';
                        li.onclick = () => jumpToPage(sIdx);
                        li.innerHTML = `<span>${spice.title} ${spice.flag || ''}</span><span class="dots"></span><span>🔎</span>`;
                        targetGrid.appendChild(li);
                    });
                }, 10);

                indicator.innerText = "ÍNDICE DE ESPECIAS";
            }

            else if (p.type === 'GLOSARIO_ITEM') {
                const e = p.data;
                
                // PROTECCIÓN ANTIFALLAS: Si en tu JSON no pusiste "sensory", el motor define ceros automáticos y no se traba
                const sens = e.sensory || { picante: 0, aromatico: 0, terroso: 0, dulce: 0 };

                left.innerHTML = `
                    <div class="page-header">
                        <span class="cover-subtitle" style="font-size:8.5pt;">Las Especias</span>
                        <a class="return-link" onclick="jumpToPage(${idxGlosarioPos})">← Índice Especias</a>
                    </div>
                    <h1>${e.title} <span class="flag-emoji">${e.flag || ''}</span></h1>
                    <h2>Perfil: ${e.category || 'Aromático'}</h2>
                    <p><em>${e.introduction || ''}</em></p>
                    
                    <h2>Gráfico Sensorial</h2>
                    <div class="sensory-chart">
                        <div class="chart-row"><span class="chart-label">Picante</span><div class="chart-bar-container"><div class="chart-bar" style="width:${sens.picante}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Aromático</span><div class="chart-bar-container"><div class="chart-bar" style="width:${sens.aromatico}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Terroso</span><div class="chart-bar-container"><div class="chart-bar" style="width:${sens.terroso}%"></div></div></div>
                        <div class="chart-row"><span class="chart-label">Dulce</span><div class="chart-bar-container"><div class="chart-bar" style="width:${sens.dulce}%"></div></div></div>
                    </div>`;

                let secHtml = e.sections ? e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('') : '';
                
                right.innerHTML = `
                    <div class="page-header"><span class="cover-subtitle" style="font-size:8.5pt; margin-left:auto;">Análisis Técnico</span></div>
                    ${secHtml}`;
                indicator.innerText = `ESPECIA ${p.index + 1} / ${GLOSARIO_DATA.length}`;
            }

            if(typeof twemoji !== 'undefined') twemoji.parse(document.body);
        }

        function renderCategoryInIndex(cat, targetContainer) {
            const deEstaCat = recetasRaw.filter(r => r.category && r.category.toLowerCase() === cat.toLowerCase());
            if (deEstaCat.length > 0) {
                const secDiv = document.createElement('div');
                secDiv.className = 'index-section';
                secDiv.innerHTML = `<h3>${cat}</h3>`;
                const ul = document.createElement('ul');
                ul.className = 'index-list';

                deEstaCat.forEach(r => {
                    const rIdx = paginasLineales.findIndex(page => page.type === 'RECETA_ITEM' && page.data.title === r.title);
                    const li = document.createElement('li');
                    li.className = 'index-item';
                    li.onclick = () => jumpToPage(rIdx);
                    li.innerHTML = `<span>${r.title}</span><span class="dots"></span><span>👉</span>`;
                    ul.appendChild(li);
                });
                secDiv.appendChild(ul);
                targetContainer.appendChild(secDiv);
            }
        }

        function goForward() { if (currentIndex < paginasLineales.length - 1) { currentIndex++; render(); } }
        function goBack() { if (currentIndex > 0) { currentIndex--; render(); } }
        function jumpToPage(pageIndex) { if (pageIndex >= 0 && pageIndex < paginasLineales.length) { currentIndex = pageIndex; render(); } }

        document.addEventListener('DOMContentLoaded', loadBookDatabases);
    </script>
</body>
</html>
