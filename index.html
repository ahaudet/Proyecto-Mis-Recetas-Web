<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Recetas - Edición Editorial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@14.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-papel: #fcfbfa;
            --color-borde: #e2dacd;
            --color-texto: #2c2520;
            --color-acento: #5c1d1d;
        }

        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal del libro */
        .book-container {
            display: flex;
            width: 95vw;
            max-width: 1100px;
            height: 80vh;
            min-height: 500px;
            background-color: var(--color-papel);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border-radius: 4px;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Efecto de sombra central (el lomo) */
        .book-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent 50%, rgba(0,0,0,0.1));
            transform: translateX(-50%); pointer-events: none;
            z-index: 10;
        }

        /* Estilo de las páginas */
        .page {
            width: 50%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Clase para Portadas (Libro cerrado) */
        .book-container.closed {
            max-width: 550px; /* Ancho de una sola página */
        }
        .book-container.closed::after { display: none; } /* Quitamos lomo si está cerrado */
        .book-container.closed .page-right { display: none; }
        .book-container.closed .page-left { width: 100%; border: none; }

        .page-left { border-right: 1px solid rgba(0,0,0,0.05); }

        /* Tipografía y elementos */
        .cover-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid var(--color-acento);
            margin: 10px;
            padding: 20px;
        }

        .cover-title { font-size: clamp(24pt, 5vw, 45pt); color: var(--color-acento); margin-bottom: 5px; }
        .cover-subtitle { font-size: 14pt; letter-spacing: 5px; color: #8c7662; text-transform: uppercase; }

        h1 { font-size: 22pt; color: var(--color-acento); margin: 0; }
        h2 { font-size: 11pt; text-transform: uppercase; border-bottom: 1px dashed var(--color-borde); padding-bottom: 5px; margin-top: 20px; color: var(--color-acento); }
        
        .item-image {
            width: 100%; max-height: 200px; object-fit: cover;
            border-radius: 2px; margin: 15px 0; border: 1px solid var(--color-borde);
        }

        p, li { font-size: 10.5pt; line-height: 1.5; text-align: justify; color: var(--color-texto); }
        
        .chef-notes {
            background-color: #f5efe6;
            border-left: 3px solid #8c7662;
            padding: 15px; margin-top: auto;
            font-style: italic; font-size: 9.5pt;
        }

        /* Controles */
        .nav-controls {
            margin-top: 20px;
            display: flex; gap: 15px;
            background: white; padding: 10px 25px;
            border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            align-items: center; z-index: 100;
        }

        .nav-btn {
            background: none; border: 1px solid #8c7662;
            color: #8c7662; padding: 8px 15px;
            border-radius: 20px; cursor: pointer;
        }
        .nav-btn:hover { background: #8c7662; color: white; }

        @media (max-width: 600px) {
            .book-container { height: 75vh; }
            .page { padding: 20px; }
            .nav-controls { scale: 0.8; }
        }
    </style>
</head>
<body>

    <div class="book-container closed" id="book">
        <div class="page page-left" id="left-page"></div>
        <div class="page page-right" id="right-page"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goBack()">Anterior</button>
        <span id="page-indicator" style="font-size: 9pt; font-weight: bold; font-family: sans-serif;">PORTADA</span>
        <button class="nav-btn" onclick="goForward()">Siguiente</button>
    </div>

    <script>
        // Aquí usaríamos tus datos (GLOSARIO_DATA y bookData.recetas)
        // [PARA EL EJEMPLO, MANTENGO LOS DATOS DE TU SCRIPT ANTERIOR]
        const GLOSARIO_DATA = [
            { title: "Ají Molido", flag: "🇦🇷", category: "Picante", introduction: "Fruto desecado...", sections: [{title: "Origen", content: "Noroeste Argentino..."}] },
            { title: "Anís Estrellado", flag: "🇨🇳", category: "Aromático", introduction: "Fruto seco...", sections: [{title: "Origen", content: "China..."}] }
            // ... resto de tus 24 especias
        ];

        let bookData = { recetas: [], glosario: GLOSARIO_DATA };
        let currentState = 'PORTADA';
        let currentIndex = 0;

        function loadRecipes() {
            // Simulamos carga o fetch real
            fetch('recetas.json')
                .then(r => r.json())
                .then(data => { bookData.recetas = data; render(); })
                .catch(() => { console.log("Usando datos locales"); render(); });
        }

        function render() {
            const book = document.getElementById('book');
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            // Efecto de transición simple
            left.style.opacity = 0;
            right.style.opacity = 0;

            setTimeout(() => {
                if (currentState === 'PORTADA') {
                    book.classList.add('closed');
                    left.innerHTML = `
                        <div class="cover-content">
                            <div class="cover-subtitle">Libro de Cocina</div>
                            <h1 class="cover-title">Mis Recetas</h1>
                            <div style="margin-top:40px; font-style:italic">Por Alejandro Haudet</div>
                        </div>`;
                    indicator.innerText = "PORTADA";
                } 
                
                else if (currentState === 'RECETAS') {
                    book.classList.remove('closed');
                    const r = bookData.recetas[currentIndex] || {title: "Sin Recetas", ingredients: [], instructions: ""};
                    left.innerHTML = `
                        <h1>${r.title}</h1>
                        <div style="font-size:9pt; color:#8c7662; margin-bottom:10px">RECETARIO</div>
                        ${r.image ? `<img src="fotos-receta/${r.image}" class="item-image">` : ''}
                        <h2>Ingredientes</h2>
                        <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
                    
                    right.innerHTML = `
                        <h2>Preparación</h2>
                        <ol>${r.instructions.split(',').map(p => `<li>${p.trim()}</li>`).join('')}</ol>
                        ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}`;
                    indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;
                }

                else if (currentState === 'SEPARADOR') {
                    book.classList.add('closed');
                    left.innerHTML = `
                        <div class="cover-content" style="border-color: #8c7662">
                            <div class="cover-subtitle">Capítulo II</div>
                            <h1 class="cover-title" style="font-size:28pt">Glosario de Especias</h1>
                        </div>`;
                    indicator.innerText = "ANEXO TÉCNICO";
                }

                else if (currentState === 'GLOSARIO') {
                    book.classList.remove('closed');
                    const e = bookData.glosario[currentIndex];
                    left.innerHTML = `
                        <h1>${e.title} ${e.flag}</h1>
                        <p><em>${e.introduction}</em></p>
                        <h2>Perfil</h2>
                        <p>${e.category}</p>`;
                    
                    let secHtml = e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('');
                    right.innerHTML = secHtml;
                    indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
                }

                left.style.opacity = 1;
                right.style.opacity = 1;
                twemoji.parse(document.body);
            }, 300);
        }

        function goForward() {
            if (currentState === 'PORTADA') { currentState = 'RECETAS'; currentIndex = 0; }
            else if (currentState === 'RECETAS') {
                if (currentIndex < bookData.recetas.length - 1) currentIndex++;
                else { currentState = 'SEPARADOR'; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'GLOSARIO'; currentIndex = 0; }
            else if (currentState === 'GLOSARIO') {
                if (currentIndex < bookData.glosario.length - 1) currentIndex++;
            }
            render();
        }

        function goBack() {
            if (currentState === 'GLOSARIO') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'SEPARADOR'; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'RECETAS'; currentIndex = bookData.recetas.length - 1; }
            else if (currentState === 'RECETAS') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'PORTADA'; }
            }
            render();
        }

        document.addEventListener('DOMContentLoaded', loadRecipes);
    </script>
</body>
</html>
