                    introduction: "Bahārāt (que significa «especias» en árabe) es una mezcla de especias utilizada en Oriente Medio. Es cálido y aromático con fuertes notas terrosas.",
                    sections: [
                        { title: "Composición Típica", content: "Pimienta negra, cilantro, pimentón, cardamomo, nuez moscada, comino, clavos y canela." },
                        { title: "Usos en la Cocina", content: "Ideal para cordero, pollo, pescado, sopas y arroces. Es el alma de las empanadas árabes o fatay." }
                    ]
                },
                {
                    title: "Canela",
                    flag: "🇱🇰",
                    category: "dulce",
                    introduction: "Una de las especias más antiguas y utilizadas del mundo. Su aroma dulce y cálido es inconfundible.",
                    sections: [
                        { title: "Variedades", content: "Canela de Ceilán (más suave y aromática) y Cassia (más común, dura y robusta)." },
                        { title: "Usos", content: "Fundamental en repostería, infusiones calientes y platos salados de Oriente Medio, India y México. Una pizca en salsas de tomate reduce la acidez." }
                    ]
                },
                {
                    title: "Cardamomo",
                    flag: "🇮🇳",
                    category: "herbal",
                    introduction: "Conocida como la 'Reina de las Especias', tiene un sabor complejo con notas cítricas, picantes y mentoladas.",
                    sections: [
                        { title: "Variedades", content: "Verde (aromático, fresco y versátil) y negro (ahumado, rústico e intenso)." },
                        { title: "Usos Culinarios", content: "Esencial en el té chai indio, café árabe y curries. En repostería brilla en los bollos tradicionales escandinavos." }
                    ]
                },
                {
                    title: "Cayena",
                    flag: "🇬🇫",
                    category: "picante",
                    introduction: "Pimiento muy picante originario de América. Su picor característico proviene de la capsaicina pura.",
                    sections: [
                        { title: "Origen y Usos", content: "Introducida en Europa por Colón. Aporta picor directo sin alterar los sabores base del plato. Ideal para guisos, salsas y marinadas." }
                    ]
                },
                {
                    title: "Clavo de Olor",
                    flag: "🇮🇩",
                    category: "dulce",
                    introduction: "Capullos secos del árbol Syzygium aromaticum, nativo de Indonesia. Posee uno de los aromas más intensos y penetrantes.",
                    sections: [
                        { title: "Usos Culinarios", content: "En repostería clásica (pan de especias), almíbares, escabeches y curries. Usar con extrema moderación dado su poder." }
                    ]
                },
                {
                    title: "Coriandro",
                    flag: "🌍",
                    category: "herbal",
                    introduction: "Proviene de la planta Coriandrum sativum. Las semillas son cálidas y cítricas; las hojas son el cilantro fresco.",
                    sections: [
                        { title: "Coriandro vs Cilantro", content: "No son intercambiables en cocina. El coriandro seco es cálido y evoca a la nuez; el cilantro fresco es herbal y penetrante." }
                    ]
                },
                {
                    title: "Curry",
                    flag: "🇮🇳",
                    category: "mezcla",
                    introduction: "Mezcla occidentalizada de especias indias cuyo nombre proviene del tamil 'kaṟi' (salsa).",
                    sections: [
                        { title: "Ingredientes Base", content: "Cilantro, cúrcuma (que le da el color amarillo), comino, alholva, jengibre y ajo." }
                    ]
                },
                {
                    title: "Garam Masala",
                    flag: "🇮🇳",
                    category: "mezcla",
                    introduction: "'Mezcla caliente' del norte de la India. De sabor marcadamente cálido, reconfortante y aromático.",
                    sections: [
                        { title: "Uso correcto", content: "A diferencia del curry, se añade casi al final de la cocción para conservar intacto su perfume volátil." }
                    ]
                },
                {
                    title: "Jengibre",
                    flag: "🇮🇳",
                    category: "herbal",
                    introduction: "Rizoma subterráneo de la planta Zingiber officinale. De sabor picante, cítrico y muy refrescante.",
                    sections: [
                        { title: "Formatos", content: "Fresco: más picante y aromático para salteados. En polvo: más terroso y dulce para panadería." }
                    ]
                },
                {
                    title: "Merkén",
                    flag: "🇨🇱",
                    category: "picante",
                    introduction: "Condimento tradicional mapuche ahumado de Chile y la Patagonia Argentina. Sabor terroso y cálido.",
                    sections: [
                        { title: "Composición", content: "Ají cacho de cabra seco y ahumado en maderas nativas, mezclado con sal y semillas de cilantro tostadas." },
                        { title: "Usos", content: "Espectacular en cazuelas de mariscos, legumbres, carnes rojas a la parrilla y papas rústicas." }
                    ]
                },
                {
                    title: "Ras el Hanout",
                    flag: "🇲🇦",
                    category: "mezcla",
                    introduction: "Mezcla marroquí compleja y aromática. Su nombre significa literalmente 'lo mejor de la tienda'.",
                    sections: [
                        { title: "Composición", content: "Puede tener más de 30 ingredientes balanceados, incluyendo tradicionalmente pétalos de rosa secos o lavanda." }
                    ]
                },
                {
                    title: "Shichimi Togarashi",
                    flag: "🇯🇵",
                    category: "picante",
                    introduction: "Conocido como los 'Siete sabores de chile', es una mezcla japonesa picante, cítrica y con sutiles notas marinas.",
                    sections: [
                        { title: "Composición", content: "Chile rojo, sansho, piel de naranja tostada, semillas de sésamo, amapola, cáñamo y trozos de alga nori." },
                        { title: "Platos", content: "Condimento final de mesa para platos calientes como el ramen, udon, yakitori y cazuelas complejas." }
                    ]
                }
            ]
        };

        let bookData = INTEGRATED_DATA;
        let currentState = 'PORTADA';
        let currentIndex = 0;

        function init() {
            render();
            setupGlobalEvents();
        }

        function render() {
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            if (!left || !right || !indicator) return;

            if (currentState === 'PORTADA') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Libro de Cocina</div>
                    <div class="cover-title">Mis Recetas</div>
                    <div class="cover-author">Por Alejandro Haudet</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">"Un paseo culinario por los sabores de casa, técnicas tradicionales y el alma de nuestra cocina."</p>
                </div>`;
                indicator.innerText = "PORTADA";
            } 
            
            else if (currentState === 'RECETAS') {
                const r = bookData.recetas[currentIndex];
                left.innerHTML = `
                    <div class="section-tag">Capítulo I • Recetario</div>
                    <h1>${r.title}</h1>
                    <div class="metadata-line">${r.category}</div>
                    ${r.image ? `<img src="${r.image}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <h2>Ingredientes</h2>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                `;
                
                const pasosArr = r.instructions.split(',');
                const pasosHtml = pasosArr.map(paso => paso.trim() ? `<li>${paso.trim()}</li>` : '').join('');
                
                right.innerHTML = `
                    <div class="metadata-line" style="text-align:right">Preparación</div>
                    <ol>${pasosHtml}</ol>
                    ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}
                `;
                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;
            }

            else if (currentState === 'SEPARADOR') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Anexo Técnico</div>
                    <div class="cover-title" style="font-size:35pt">Glosario de Especias</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">Estudio de los pilares aromáticos y botánicos que definen nuestra identidad gastronómica.</p>
                </div>`;
                indicator.innerText = "SECCIÓN: ESPECIAS";
            }

            else if (currentState === 'GLOSARIO') {
                const e = bookData.glosario[currentIndex];
                left.innerHTML = `
                    <div class="section-tag">Capítulo II • Glosario</div>
                    <h1>${e.title} ${e.flag || ''}</h1>
                    <div class="metadata-line">Perfil: ${e.category}</div>
                    ${e.image ? `<img src="${e.image}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <p><em>${e.introduction}</em></p>
                `;
                let secHtml = e.sections ? e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('') : '';
                right.innerHTML = `<div class="metadata-line" style="text-align:right">Análisis Técnico</div>${secHtml}`;
                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }
        }

        function goForward() {
            if (currentState === 'PORTADA') { currentState = 'RECETAS'; currentIndex = 0; }
            else if (currentState === 'RECETAS') {
                if (currentIndex < bookData.recetas.length - 1) currentIndex++;
                else { currentState = 'SEPARADOR'; currentIndex = 0; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'GLOSARIO'; currentIndex = 0; }
            else if (currentState === 'GLOSARIO') {
                if (currentIndex < bookData.glosario.length - 1) currentIndex++;
            }
            render();
        }

        function goBack() {
            if (currentState === 'GLOSARIO') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'SEPARADOR'; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'RECETAS'; currentIndex = bookData.recetas.length - 1; }
            else if (currentState === 'RECETAS') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'PORTADA'; }
            }
            render();
        }

        function setupGlobalEvents() {
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('glossary-link')) {
                    const targetSpice = e.target.getAttribute('data-target');
                    if (targetSpice) {
                        const index = bookData.glosario.findIndex(g => g.title.toLowerCase() === targetSpice.toLowerCase());
                        if (index !== -1) {
                            currentState = 'GLOSARIO';
                            currentIndex = index;
                            render();
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
