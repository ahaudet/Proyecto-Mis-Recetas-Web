                        { title: "Origen y Apariencia", content: "Originario del sur de China, Corea y Japón. Es el pericarpio seco del fruto, que forma una estrella de 8 puntas." },
                        { title: "Usos en la Cocina", content: "Ingrediente esencial en el 'Polvo de Cinco Especias' chino y en la sopa vietnamita Pho. Excelente para aromatizar caldos y guisos." }
                    ]
                },
                {
                    title: "Bahārāt", flag: "🌍", category: "mezcla",
                    introduction: "Bahārāt (significa «especias» en árabe) es una mezcla de Oriente Medio. Cálido y aromático con notas terrosas.",
                    sections: [
                        { title: "Composición Típica", content: "Pimienta negra, cilantro, pimentón, cardamomo, nuez moscada, comino, clavos y canela." },
                        { title: "Usos en la Cocina", content: "Ideal para cordero, pollo, pescado, sopas y arroces. Es el condimento estrella de las empanadas árabes." }
                    ]
                },
                {
                    title: "Canela", flag: "🇱🇰", category: "dulce",
                    introduction: "Una de las especias más antiguas y utilizadas del mundo. Su aroma dulce y cálido es inconfundible.",
                    sections: [
                        { title: "Variedades Principales", content: "Canela de Ceilán (más suave y aromática) y Cassia (más común y robusta)." },
                        { title: "Usos en la Cocina", content: "Fundamental en repostería, bebidas calientes y platos salados de Oriente Medio, India y México." }
                    ]
                },
                {
                    title: "Cardamomo", flag: "🇮🇳", category: "herbal",
                    introduction: "Conocido como la 'Reina de las Especias', tiene un sabor complejo con notas cítricas y mentoladas.",
                    sections: [
                        { title: "Variedades", content: "Verde (aromático y versátil) y negro (ahumado e intenso)." },
                        { title: "Usos en la Cocina", content: "Esencial en el té chai indio, café árabe y curries. En repostería brilla en bollos escandinavos." }
                    ]
                },
                {
                    title: "Cayena", flag: "🇬🇫", category: "picante",
                    introduction: "Pimiento muy picante originario de América. Su picor proviene de la capsaicina.",
                    sections: [
                        { title: "Origen y Usos", content: "Introducida en Europa por Colón. Aporta picor sin alterar sabores, ideal para guisos, salsas, pizzas y marinadas." }
                    ]
                },
                {
                    title: "Clavo de Olor", flag: "🇮🇩", category: "dulce",
                    introduction: "Capullos secos del árbol Syzygium aromaticum, nativo de Indonesia. Posee uno de los aromas más intensos.",
                    sections: [
                        { title: "Origen e Intensidad", content: "Originario de las Islas Molucas. Su sabor es extremadamente potente: uno o dos clavos bastan para aromatizar un guiso completo." }
                    ]
                },
                {
                    title: "Coriandro", flag: "🌍", category: "herbal",
                    introduction: "Proviene de la planta Coriandrum sativum. Las semillas son cálidas y cítricas.",
                    sections: [
                        { title: "Coriandro vs Cilantro", content: "No son intercambiables. El coriandro es cálido y a nuez; el cilantro fresco es herbal y potente." }
                    ]
                },
                {
                    title: "Curry", flag: "🇮🇳", category: "mezcla",
                    introduction: "Mezcla india de especias cuyo nombre proviene del tamil 'kaṟi' (salsa).",
                    sections: [
                        { title: "Ingredientes Base", content: "Cilantro, cúrcuma, comino, alholva, jengibre, ajo, canela y clavo." }
                    ]
                },
                {
                    title: "Garam Masala", flag: "🇮🇳", category: "mezcla",
                    introduction: "'Mezcla caliente' del norte de la India. De sabor cálido y aromático.",
                    sections: [
                        { title: "Uso Culinario", content: "Se añade al final de la cocción para conservar su perfume volátil intacto." }
                    ]
                },
                {
                    title: "Jengibre", flag: "🇮🇳", category: "herbal",
                    introduction: "Raíz (rizoma) del Zingiber officinale. Sabor picante, cítrico y refrescante.",
                    sections: [
                        { title: "Usos", content: "Base en sofritos, curries, sopas, bebidas (ginger ale, té) y galletas tradicionales de jengibre." }
                    ]
                },
                {
                    title: "Kashmiri Masala", flag: "🇮🇳", category: "picante",
                    introduction: "Mezcla suave y colorida de la cocina india. Da color rojo intenso sin exceso de picor.",
                    sections: [
                        { title: "Ingrediente Estrella", content: "Chile de Cachemira molido, suave y de color vibrante." }
                    ]
                },
                {
                    title: "Merkén", flag: "🇨🇱", category: "picante",
                    introduction: "Condimento mapuche ahumado de Chile y Argentina. Sabor terroso y cálido.",
                    sections: [
                        { title: "Composición", content: "Ají cacho de cabra ahumado con sal y cilantro tostado." },
                        { title: "Usos en la Cocina", content: "En carnes, legumbres, papas y cazuelas de mariscos." }
                    ]
                },
                {
                    title: "Páprika", flag: "🇭🇺", category: "dulce",
                    introduction: "Pimiento rojo molido, esencial en la cocina húngara.",
                    sections: [
                        { title: "Tipos y Consejos", content: "Édes (dulce), Csípős (picante) y Füstölt (ahumada). No añadir a aceite hirviendo: se quema e intensifica el amargor." }
                    ]
                },
                {
                    title: "Ras el Hanout", flag: "🇲🇦", category: "mezcla",
                    introduction: "Mezcla marroquí compleja y aromática. Significa 'lo mejor de la tienda'.",
                    sections: [
                        { title: "Composición", content: "Puede tener más de 30 ingredientes, incluidos pétalos de rosa secos o flores de lavanda." }
                    ]
                },
                {
                    title: "Shichimi Togarashi", flag: "🇯🇵", category: "picante",
                    introduction: "'Siete sabores de chile', mezcla japonesa picante, cítrica y con s Sesame.",
                    sections: [
                        { title: "Composición Típica", content: "Chile rojo, sansho, piel de naranja, sésamo, amapola, cáñamo y alga nori." }
                    ]
                }
            ]
        };

        let bookData = BOOK_DATABASE;
        let currentState = 'PORTADA';
        let currentIndex = 0;

        function init() {
            render();
            setupGlobalEvents();
        }

        function render() {
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            if (!left || !right || !indicator) return;

            if (currentState === 'PORTADA') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Libro de Cocina</div>
                    <div class="cover-title">Mis Recetas</div>
                    <div class="cover-author">Por Alejandro Haudet</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">"Un paseo culinario por los sabores de casa, técnicas tradicionales y el alma de nuestra cocina."</p>
                </div>`;
                indicator.innerText = "PORTADA";
            } 
            
            else if (currentState === 'RECETAS') {
                const r = bookData.recetas[currentIndex];
                // Resolvemos las imágenes apuntando directo a la subcarpeta de forma nativa
                const finalImgPath = r.image ? `fotos-receta/${r.image}` : '';

                left.innerHTML = `
                    <div class="section-tag">Capítulo I • Recetario</div>
                    <h1>${r.title}</h1>
                    <div class="metadata-line">${r.category}</div>
                    ${finalImgPath ? `<img src="${finalImgPath}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <h2>Ingredientes</h2>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                `;
                
                const pasosArr = r.instructions.split(',');
                const pasosHtml = pasosArr.map(paso => paso.trim() ? `<li>${paso.trim()}</li>` : '').join('');
                
                right.innerHTML = `
                    <div class="metadata-line" style="text-align:right">Preparación</div>
                    <ol>${pasosHtml}</ol>
                    ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}
                `;
                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;
            }

            else if (currentState === 'SEPARADOR') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Anexo Técnico</div>
                    <div class="cover-title" style="font-size:35pt">Glosario de Especias</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">Estudio de los pilares aromáticos y botánicos que definen nuestra identidad gastronómica.</p>
                </div>`;
                indicator.innerText = "SECCIÓN: ESPECIAS";
            }

            else if (currentState === 'GLOSARIO') {
                const e = bookData.glosario[currentIndex];

                left.innerHTML = `
                    <div class="section-tag">Capítulo II • Glosario</div>
                    <h1>${e.title} ${e.flag}</h1>
                    <div class="metadata-line">Perfil: ${e.category}</div>
                    <p><em>${e.introduction}</em></p>
                `;
                let secHtml = e.sections ? e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('') : '';
                right.innerHTML = `<div class="metadata-line" style="text-align:right">Análisis Técnico</div>${secHtml}`;
                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }
        }

        function goForward() {
            if (currentState === 'PORTADA') { currentState = 'RECETAS'; currentIndex = 0; }
            else if (currentState === 'RECETAS') {
                if (currentIndex < bookData.recetas.length - 1) currentIndex++;
                else { currentState = 'SEPARADOR'; currentIndex = 0; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'GLOSARIO'; currentIndex = 0; }
            else if (currentState === 'GLOSARIO') {
                if (currentIndex < bookData.glosario.length - 1) currentIndex++;
            }
            render();
        }

        function goBack() {
            if (currentState === 'GLOSARIO') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'SEPARADOR'; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'RECETAS'; currentIndex = bookData.recetas.length - 1; }
            else if (currentState === 'RECETAS') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'PORTADA'; }
            }
            render();
        }

        function setupGlobalEvents() {
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('glossary-link')) {
                    const targetSpice = e.target.getAttribute('data-target');
                    if (targetSpice) {
                        const index = bookData.glosario.findIndex(g => g.title.toLowerCase() === targetSpice.toLowerCase());
                        if (index !== -1) {
                            currentState = 'GLOSARIO';
                            currentIndex = index;
                            render();
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
