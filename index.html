    <style>
        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column;

            min-height: 100vh;
        }
        .book-container {
            display: flex; width: 100%; max-width: 1200px; min-height: 670px;

            content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;

            transform: translateX(-50%); pointer-events: none;
        }
        .page {
            width: 50%; padding: 45px 50px; box-sizing: border-box;
            background-color: #fcfbfa; overflow-y: auto; display: flex; flex-direction: column;
        }
        .page-left { border-right: 1px solid rgba(0,0,0,0.05); }
        .page-right { border-left: 1px solid rgba(0,0,0,0.05); padding-left: 60px; }
        
        img.emoji {
            height: 1.2em;
            width: 1.2em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
            display: inline-block;
        }

        .cover-page {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; margin: auto;
        }
        .cover-title { font-size: 50pt; color: #5c1d1d; margin-bottom: 10px; font-weight: normal; }
        .cover-subtitle { font-size: 18pt; color: #8c7662; text-transform: uppercase; letter-spacing: 4px; }
        .cover-author { margin-top: 50px; font-style: italic; color: #7a6855; }
        .section-tag { font-size: 8.5pt; text-transform: uppercase; letter-spacing: 2px; color: #8c7662; margin-bottom: 10px; font-weight: bold; }

        .metadata-line { font-size: 9.5pt; text-transform: uppercase; letter-spacing: 1px; color: #7a6855; border-bottom: 1px solid #e2dacd; padding-bottom: 12px; margin-bottom: 20px; }
        h2 { font-size: 11pt; text-transform: uppercase; color: #5c1d1d; border-bottom: 1px dashed #e2dacd; padding-bottom: 4px; margin-top: 20px; }
        .item-image {
            width: 100%; max-height: 230px; object-fit: cover; border-radius: 4px;

        }
        p, li { color: #2c2520; line-height: 1.6; font-size: 11pt; text-align: justify; }

        .chef-notes { background-color: #f5efe6; border-left: 3px solid #8c7662; padding: 15px; margin-top: auto; font-style: italic; }
        .nav-controls { display: flex; gap: 15px; background: white; padding: 10px 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); align-items: center; }
        .nav-btn { background: none; border: 1px solid #8c7662; color: #8c7662; padding: 6px 18px; border-radius: 20px; cursor: pointer; font-family: Arial, sans-serif; }
        .nav-btn:hover { background-color: #8c7662; color: white; }
        .glossary-link { color: #5c1d1d; text-decoration: none; border-bottom: 1px dashed #5c1d1d; cursor: pointer; font-weight: bold; }
        .glossary-link:hover { background-color: #f5efe6; border-bottom: 1px solid #5c1d1d; }
        @media (max-width: 850px) {
            .book-container { flex-direction: column; min-height: auto; }
            .book-container::after { display: none; }
            .page { width: 100%; padding: 30px 25px; }
            .page-left { border-right: none; border-bottom: 1px dashed #e2dacd; }
            .page-right { padding-left: 25px; border-left: none; }
        }

    <script>
        // BASE DE DATOS DEL GLOSARIO (Unificada con tus 24 Especias detalladas)
        const GLOSARIO_DATA = [
            {
                title: "Ají Molido", flag: "🇦🇷", category: "Picante",
                introduction: "Fruto desecado y triturado del género Capsicum, pilar indiscutido de la identidad gastronómica de la región rioplatense andina y la cocina criolla.",
                sections: [
                    { title: "Origen y Geografía", content: "Aunque los cultivos del género Capsicum tienen un arraigo ancestral en toda América, la producción de esta molienda tradicional se concentra con gran fuerza en el Noroeste Argentino (región del NOA), principalmente en los valles calchaquíes de Salta y Catamarca. Las condiciones de suelo y el secado artesanal al sol de la región consolidaron una denominación de origen de hecho para el recetario tradicional local." },
                    { title: "Perfil Sensorial", content: "A diferencia de chiles con pungencias extremas, se caracteriza por un picor moderado y amigable al paladar. Presenta un perfil complejo que equilibra notas sutilmente dulces, frutales y un marcado ahumado natural derivado de sus métodos de deshidratación. Su textura no es un polvo fino, sino un triturado rústico con presencia dinámica de escamas rojas y pepitas blanquecinas que aportan textura." },
                    { title: "Usos comunes", content: "Es el alma mater del chimichurri tradicional y el adobo criollo. Constituye una base obligatoria para los rellenos de empanadas salteñas y tucumanas, el locro, los guisados de lentejas y la salsa tamalera. TECNICA GASTRONOMICA: Funciona de manera excelente para saborizar aceites de acabado en caliente directo sobre la parrilla. Para maximizar su expresión, se recomienda hidratarlo unos minutos en un chorrito de agua tibia o caldo antes de incorporarlo a emulsiones aceitosas." }
                ]
            },
            {
                title: "Anís Estrellado", flag: "🇨🇳", category: "Aromático",
                introduction: "Fruto seco con forma de estrella de ocho puntas obtenido del árbol perennifolio Illicium verum, famoso por su alta concentración de anetol.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las regiones del suroeste de China y el norte de Vietnam, donde se ha cultivado tradicionalmente durante milenios tanto para uso culinario como en la medicina tradicional oriental. Su introducción en Occidente a través de las rutas comerciales revoluciono la repostería y la licorería europea gracias a su perfil único, marcando una clara diferencia botánica con el anís verde común." },
                    { title: "Perfil Sensorial", content: "Se caracteriza por un aroma licoroso, penetrante y profundamente dulce. En boca ofrece un sabor anisado intenso con notas sutilmente amaderadas y un dejo ligeramente picante o fresco en el retrogusto. El compuesto químico responsable de este perfil es el aceite esencial de anetol, el cual se encuentra concentrado de manera uniforme en la resistente corteza de los carpelos que forman la estrella." },
                    { title: "Usos comunes", content: "Es el pilar fundamental de la mezcla china del Polvo de 5 Especias y un ingrediente indispensable para aromatizar caldos largos asiáticos como el Pho vietnamita. En Occidente destaca en la repostería invernal, infusiones, compotas y la destilación de licores. TECNICA GASTRONOMICA: Su gran resistencia al calor lo hace ideal para cocciones prolongadas en guisados de carne, almíbares y fondos. Para liberar mejor sus aceites, se puede quebrar ligeramente la estrella antes de sumergirla en el líquido caliente." }
                ]
            },
            {
                title: "Baharat", flag: "🌍", category: "Mezcla",
                introduction: "Mezcla de especias cálida, aromática y de notas terrosas o ahumadas, fundamental en Oriente Medio, la región del Golfo Arábigo, Grecia y Turquía.",
                sections: [
                    { title: "Origen y Geografía", content: "Desarrollada históricamente a partir del rol de los comerciantes árabes en el mundo antiguo. Se extendió ampliamente por el Mediterráneo, generando variantes locales como la versión turca (con mucha menta) o la tunecina (con capullos de rosa y canela)." },
                    { title: "Perfil Sensorial", content: "Perfil cálido y aromático con fuertes notas terrosas y ahumadas. Solo una pizca es capaz de potenciar los sabores de carnes, pollos, pescados (sobre todo grasos como caballa y salmón), verduras, sopas y salsas." },
                    { title: "Usos comunes", content: "Se usa en marinadas (aceite, limón y baharat) o directo en carnes picadas. RECETA CASERA (para 3/4 taza): Combinar 2 cdas de pimienta negra, cilantro y comino; 1 cdta de cardamomo; 1/2 cdta de clavos; y 4 palitos de canela. Tostar en sartén a fuego medio-alto hasta que suelten fragancia, dejar enfriar y moler. Mezclar con 2 cdas de pimentón dulce y 1/2 cdta de nuez moscada. (Tip: sumar menta seca para estilo turco o chile para picor)." }
                ]
            },
            {
                title: "Canela", flag: "🇱🇰", category: "Dulce",
                introduction: "Corteza interna desecada y enrollada del árbol de hoja perenne Cinnamomum verum, considerada una de las especias más antiguas y utilizadas del mundo.",
                sections: [
                    { title: "Origen y Geografía", content: "Originaria de Sri Lanka y el sur de la India. Históricamente citada desde el Éxodo y empleada en China en el 2500 a.C., hoy se produce también en Malasia, Java, Madagascar, Brasil y Guyana. Existen más de 100 variedades, destacando la canela de Ceilán por su alta calidad. También se comercializa la Casia (Cinnamomum cassia) o canela de China, la cual posee un aroma más intenso, un valor de mercado inferior y suele venderse de forma fraudulenta como canela auténtica." },
                    { title: "Perfil Sensorial", content: "Posee un color pardo rojizo tras su secado y un aroma y sabor intensamente dulces y amaderados. La versión molida libera su sabor de forma más rápida y fuerte, ideal para repostería, aunque pierde frescura con velocidad. La canela en rama ofrece un perfume más sutil y prolongado, ideal para procesos de infusión. Su aroma contiene linalool, sustancia que ayuda a reducir la fatiga, disminuir el estrés y mejorar el estado de ánimo." },
                    { title: "Usos comunes", content: "Fundamental en la aromatización de leche para postres (arroz con leche, torrijas, cremas), bizcochos y galletas (batiéndola con la mantequilla). En platos salados, aporta intensidad al curry y a las maceraciones de pollo. TECNICAS COCTELERAS Y ESENCIAS: Se puede infusionar en agua con rodajas de naranja para bases aromáticas, o elaborar una esencia para horneado sumergiendo 2 ramas en 85 ml de ron blanco en un lugar oscuro durante 2 semanas, agitando diariamente. Tip: Conservar en frasco hermético lejos de la luz y la humedad, prefiriendo la rama entera para mayor durabilidad." }
                ]
            },
            {
                title: "Cardamomo", flag: "🇮🇳", category: "Herbal",
                introduction: "Semilla altamente aromática de la familia del jengibre, considerada una de las especias más caras del mundo junto al azafrán y la vainilla.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las selvas de la India meridional, Sri Lanka, Malaysia y Sumatra. Su uso se extendió a Oriente Medio, los países nórdicos y América Central; actualmente, Guatemala es uno de los principales productores y exportadores mundiales, reconocido por lograr una calidad que supera al de origen asiático." },
                    { title: "Perfil Sensorial", content: "Aroma intenso, sofisticado y afrutado. Presenta tres variedades comerciales: el Verde (el más común y sabroso, ideal para líquidos), el Negro (más grande, amargo y con un perfil fresco, intenso y ahumado) y el Blanco (un subproducto del lavado del verde, con un carácter mucho menos intenso)." },
                    { title: "Usos comunes", content: "En India se usa en curries, arroces y bebidas. En Oriente Medio se mezcla con café (café de hospitalidad) y en Turquía o Líbano se añade a sabrosas de pollo o marinadas de Shish taouk y shawarma. En Países Nórdicos y Centroeuropa destaca en repostería (bollos suecos, donuts, strudels) y en el vino caliente Glühwein. Tip: Comprar en vainas y moler solo los granos internos al momento para preservar su potencia." }
                ]
            },
            {
                title: "Cayena", flag: "🇬🇫", category: "Picante",
                introduction: "Pimiento de gran carácter obtenido de la planta solanácea Capsicum annuum, molido tras su secado para convertirse en una especia de intenso color rojizo y potente sabor picante.",
                sections: [
                    { title: "Origen y Geografía", content: "Originaria de América del Sur, Central y México, donde los nativos e incas ya la utilizaban con fines culinarios y medicinales en la etapa precolombina. Su introducción en Europa se asocia a Cristóbal Colón, quien la exportó por error creyendo que era la pimienta tradicional de oriente. Etimológicamente, su nombre podría prevenir de la palabra 'quiinia' (pimienta en una antigua lengua brasileña) o de la ciudad y río Cayena en la Guayana Francesa." },
                    { title: "Perfil Sensorial", content: "Presenta un color rojizo, piel tersa y brillante, e intenso aroma. Su potente picor no aporta un sabor propio a los platos, lo que la vuelve sumamente versátil. El responsable de su carácter es la molécula de capsaicina, la cual se concentra principalmente en las diminutas semillas blanquecinas de su interior y en los pericarpios que las recubren. Dependiendo de la maduración del fruto, su forma pasa de ser redonda como una guinda a más alargada y fina." },
                    { title: "Usos comunes", content: "Utilizada globalmente para dar vida y pungencia a estofados, guisos, legumbres, platos de caza, arroces, pastas, pescados, mariscos y embutidos, siendo un pilar en las cocinas mexicana y asiática, y un recurrente en la mediterránea. Es el ingrediente base de la famosa salsa Tabasco y de aceites picantes para pizzas. FORMATOS TECNICOS: Se comercializa entera, en copos/escamas o molida. La versión molida es ideal para fusionarse por completo en sopas, caldos y purés, mientras que los copos se espolvorean en pizzas o platos de cazuela." }
                ]
            },
            {
                title: "Cilantro", flag: "🌍", category: "Herbal",
                introduction: "Hierba anual de la familia de las apiáceas, fundamental a nivel global y conocida también como culantro o kuratu, caracterizada por la dualidad gastronómica entre sus hojas y sus semillas.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las regiones del Mediterráneo y el Cáucaso, es una de las hierbas aromáticas más antiguas registradas por la humanidad. Su versatilidad permitió una expansión masiva y temprana hacia Asia, donde se volvió indispensable en la cocina hindú y del sudeste asiático, y posteriormente hacia América Latina, transformándose en el sello verde indiscutido de las gastronomías mexicana, peruana y caribeña." },
                    { title: "Perfil Sensorial", content: "Ofrece un carácter fresco, intensamente cítrico y vibrante en sus hojas y tallos tiernos. Presenta la particularidad de dividir opiniones debido a los componentes aldehídos de su aceite esencial, los cuales hacen que ciertos paladares perciban un extraño matiz jabonoso. Es crucial diferenciar su perfil herbal del de sus semillas (el coriandro), ya que estas últimas aportan notas secas, amaderadas y cálidas que no son intercambiables con la hierba fresca." },
                    { title: "Usos comunes", content: "Elemento obligatorio en preparaciones en frío como ceviches, guacamole, pico de gallo, salsas criollas y adobos. También corona curries, sopas tradicionales andinas y guisados justo antes de servir. TECNICA GASTRONOMICA: Los aceites aromáticos de sus hojas son altamente volátiles y se destruyen rápidamente con el calor, por lo que debe picarse a cuchillo limpio (evitando machacarlo) e incorporarse estrictamente al final de la cocción o en crudo. Tip de conservación: Guardar los tallos sumergidos en un frasco con agua como un ramo de flores, cubierto por una bolsa en la heladera." }
                ]
            },
            {
                title: "Clavo de Olor", flag: "🇮🇩", category: "Dulce",
                introduction: "Botones florales secos y recolectados antes de abrir del árbol Syzygium aromaticum, famoso por poseer una de las mayores concentraciones de aceites esenciales del mundo vegetal.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las legendarias Islas Molucas en Indonesia, históricamente conocidas como las Islas de las Especias. Durante la Antigüedad y la Edad Media, su monopolio comercial desató disputas navales de escala global entre imperios debido a su incalculable valor y escasez. Hoy en día, su cultivo se ha expandido con éxito a otras regiones tropicales de alta humedad como Madagascar, Tanzania (isla de Zanzíbar), Sri Lanka y Brasil." },
                    { title: "Perfil Sensorial", content: "Posee un aroma penetrante, cálido, punzante y profundamente amaderado con notas sutilmente frutales. En boca despliega un sabor sumamente intenso, picante y astringente que deja una sensación levemente anestésica o de adormecimiento en la lengua. El responsable absoluto de esta potencia organoléptica es el eugenol, un compuesto químico volátil que compone hasta el noventa por ciento de su aceite esencial." },
                    { title: "Usos comunes", content: "Elemento fundamental en la elaboración de fondos de carne, salsas clásicas (como la bechamel claveteada en una cebolla), charcutería, encurtidos y conservas dulces. Forma parte de grandes mezclas mundiales como el Garam Masala o el Polvo de 5 Especias y aromatiza bebidas invernales como el vino caliente. TECNICA GASTRONOMICA: Debido a su extrema concentración, debe usarse con estricta moderación para no saturar químicamente el plato. Al usarse entero, se aconseja retirarlo antes del servicio o clavarlo firmemente en un vegetal para facilitar su extracción." }
                ]
            },
            {
                title: "Comino", flag: "🇪🇬", category: "Picante",
                introduction: "Semilla seca proveniente de la planta herbácea Cuminum cyminum, considerada uno de los pilares aromáticos más antiguos y potentes de la cocina terrosa.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de la cuenca del Mediterráneo Oriental y las regiones de Asia Central, cuenta con registros de uso que se remontan al antiguo Egipto, donde se utilizaba tanto en la gastronomía como en los procesos de momificación. Su versatilidad y carácter indispensable facilitaron una expansion masiva hacia el subcontinente indio, el norte de África, España y, posteriormente, a través de la colonización, se volvió un elemento identitario de la cocina criolla en toda América Latina." },
                    { title: "Perfil Sensorial", content: "Se caracteriza por un sabor y aroma sumamente fuertes, penetrantes, cálidos y con un marcado trasfondo terroso, acompañado de notas sutilmente amargas y cítricas. El principal responsable de esta potencia es el cuminaldehído, un compuesto orgánico presente en sus aceites esenciales. Su presencia en boca es persistente, por lo que posee la capacidad de dominar el perfil de un plato si no se dosifica con equilibrio y precisión técnica." },
                    { title: "Usos comunes", content: "Es un componente obligatorio en la arquitectura de sabor de las empanadas criollas tradicionales, las humitas, los tamales y los guisados de legumbres, además de ser la columna vertebral de grandes mezclas globales como el curry, el Garam Masala y el Baharat. También actúa como un excelente conservante natural de carnes. TECNICA GASTRONOMICA: Para liberar todo su potencial, se recomienda comprar la semilla entera y tostarla en seco en una sartén a fuego medio antes de molerla; el calor transforma el amargor crudo en notas más complejas que recuerdan a los frutos secos tostados." }
                ]
            },
            {
                title: "Coriandro", flag: "🌍", category: "Herbal",
                introduction: "Semilla pequeña, redonda y de color beige obtenida de la planta Coriandrum sativum, la misma que produce la hierba fresca conocida como cilantro.",
                sections: [
                    { title: "Origen y Geografía", content: "Proviene de la misma planta que el cilantro fresco. En regiones como Estados Unidos se diferencia semánticamente llamando 'cilantro' a las hojas y 'coriandro' a las semillas, mientras que en el Reino Unido e India se denomina cilantro a ambos elementos. Históricamente es un ingrediente clave en la cocina internacional, expandido desde curries indios y salsas mexicanas hasta mezclas de Oriente Medio y la panadería de centeno escandinava." },
                    { title: "Perfil Sensorial", content: "Posee una textura ligeramente estriada. Al triturarse o molerse desprende un aroma cálido a limón con notas sutilmente dulces y un toque a nuez. Sus notas difieren completamente de la hoja fresca (la cual es intensa, herbácea y para algunos jabonosa), por lo que semilla y hoja no son intercambiables en las preparaciones, aunque se complementan a la perfección." },
                    { title: "Usos comunes", content: "Aporta un sabor profundo, suave y distintivo en sopas, guisos, verduras asadas y condimentos para carne. Es sumamente versátil para combinar con comino, chile, cítricos, miel y hierbas, además de emplearse en galletas despiadas o panes que requieran un matiz cítrico. Tip de cocina: Se recomienda tostar las semillas enteras antes de molerlas para obtener un sabor mucho más fresco e intenso." }
                ]
            },
            {
                title: "Curry", flag: "🇮🇳", category: "Mezcla",
                introduction: "Mezcla de especias originaria de la India cuya composición varía ampliamente. Su nombre proviene del tamil 'kari', que significa salsa o condimento para el arroz.",
                sections: [
                    { title: "Origen y Geografía", content: "Gastronomía de la India. Se popularizó globalmente durante los siglos XIX y XX a través de la exportación masiva hacia Europa y las Américas. A partir de los años 1960 y 1970, con el auge de los restaurantes indios en el mundo, la preparación artesanal de mezclas especiales dejó de ser rentable en Occidente, lo que llevó a la estandarización comercial del condimento fuera de su país de origen." },
                    { title: "Perfil Sensorial", content: "Complejo, cálido y profundamente aromático. Mientras que en Occidente posee un sabor estandarizado y predecible, en la cocina hindú presenta una enorme diversidad de matices. Los cocineros locales suelen diseñar perfiles específicos utilizando especias frescas para cada receta, un conocimiento celosamente guardado que se transmite de padres a hijos." },
                    { title: "Usos comunes", content: "Base para estofados, salsas, legumbres y arroces. La columna vertebral de cualquier curry en polvo incluye cilantro, cúrcuma, comino y alholva. Según el estilo de la receta, se añaden capas de sabor con ingredientes como jengibre, ajo, semillas de hinojo, mostaza, canela, clavo, cardamomo (verde y negro), macis, nuez moscada, y variantes de pimienta (roja, negra y larga)." }
                ]
            },
            {
                title: "Garam Masala", flag: "🇮🇳", category: "Mezcla",
                introduction: "Mezcla de especias originaria del norte de la India cuyo nombre se traduce como 'mezcla caliente'. A diferencia del curry occidental, no posee color amarillo ya que no contiene cúrcuma.",
                sections: [
                    { title: "Origen y Geografía", content: "Originaria del norte de la India. No existe una receta única o canónica para su elaboración; los ingredientes varían notablemente de pueblo en pueblo e incluso entre familias, donde cada cocinero mantiene su propia combinación tradicional." },
                    { title: "Perfil Sensorial", content: "Aroma y sabor cálido, profundo y sumamente aromático. En una proporción bien equilibrada, ofrece un perfil donde ninguna especia destaca excesivamente sobre las demás, resultando en un condimento armonioso que no es ni muy fuerte, ni muy suave, ni muy picante." },
                    { title: "Usos comunes", content: "Excelente para condimentar platos de carnes, pescados, mariscos y verduras. RECETA CASERA EQUILIBRADA: Combinar 1 cdta de comino, cilantro y pimienta negra (todos en grano); 1/2 cdta de cardamomo, canela molida y nuez moscada; 1/4 cdta de clavo de olor y una pizca de chile seco. Tostar todo en sartén a fuego suave durante 5 a 10 minutos cuidando que no se queme, y luego moler en mortero o molinillo. Tip: Aunque se puede almacenar en bote hermético protegido de la luz, lo ideal para maximizar su potencia es moler las especias al momento de cocinar." }
                ]
            },
            {
                title: "Jengibre", flag: "🇮🇳", category: "Herbal",
                introduction: "Rizoma subterráneo articulado de la planta Zingiber officinale, valorado globalmente por su perfil picante, fresco y sus amplias propiedades terapéuticas.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las regiones del sudeste asiático y el sur de la de la India, donde se ha cultivado de forma ininterrumpida durante más de tres milenios. Fue una de las primeras especias orientales en llegar a Occidente a través de las rutas comerciales del Mediterráneo gracias a los mercaderes fenicios y romanos. Actualmente, India, China, Jamaica y Nigeria se posicionan como los principales productores de rizomas con alta concentración oleorresinosa." },
                    { title: "Perfil Sensorial", content: "Despliega un aroma intensamente cítrico, refrescante, amaderado y sutilmente dulce. En boca ofrece un picor punzante pero limpio, el cual no satura el paladar a largo plazo. Este carácter organoléptico se debe al gingerol cuando el rizoma está fresco, un compuesto químico que al cocinarse o deshidratarse se transforma en zingerona y shogaol, moléculas que modifican el perfil duplicando la sensación de calor en la boca." },
                    { title: "Usos comunes", content: "Ingrediente indispensable en salteados al wok, curries, pastas de especias, marinadas para carnes blancas y preparaciones de sushi (como el gari o jengibre encurtido). En Occidente lidera la repostería invernal en galletas, panes especiados y bebidas como el Gingerbread o la cerveza de jengibre. TECNICA GASTRONOMICA: Su formato define el resultado: fresco aporta notas cítricas y jugosas, ideal para salteados rápidos; en polvo ofrece un picor más seco y concentrado, óptimo para masas. Al usarlo fresco, se recomienda pelarlo raspando la piel con una cuchara para no desperdiciar la pulpa pegada a la corteza." }
                ]
            },
            {
                title: "Kashmiri Masala", flag: "🇮🇳", category: "Picante",
                introduction: "Mezcla de especias originaria de la región de Cachemira, caracterizada por su suavidad y capacidad para realzar sabores sin abrumar el paladar.",
                sections: [
                    { title: "Origen y Geografía", content: "Proviene de la región de Cachemira, al norte de la India. Esta mezcla refleja la rica herencia cultural y las tradiciones gastronómicas de un territorio que ha funcionado históricamente como un crisol de influencias." },
                    { title: "Perfil Sensorial", content: "Posee un perfil sumamente sutil y versátil que equilibra matices profundos sin una pungencia agresiva, siendo ideal tanto para fanáticos del picante como para paladares sensibles. Al integrarse en curries, ayuda a desarrollar una textura suave y cremosa que hace brillar a los ingredientes principales." },
                    { title: "Usos comunes", content: "Se utiliza en una amplia variedad de recetas con carnes, pescados y verduras. RECETA AUTENTICA: Medir 3 cdas de pimiento rojo Kashmiri, 1 cda de comino en polvo, 1 cdta de cilantro en polvo, 1/2 cdta de cúrcuma en polvo, 1/2 cdta de garam masala, y 1/4 cdta de canela, clavo de olor y cardamomo (todos en polvo). TECNICA: Seleccionar las especias (5 min), tostar en seco (10 min), moler hasta obtener un polvo fino (5 min), mezclar de ser necesario (5 min) y dejar reposar la mezcla durante 15 minutos antes de utilizarla en la receta deseada." }
                ]
            },
            {
                title: "Merkén", flag: "🇨🇱", category: "Picante",
                introduction: "Aliño tradicional elaborado a base de ají cacho de cabra seco y ahumado. Su nombre proviene del mapudungun 'medken chadi', que significa 'sal molida'.",
                sections: [
                    { title: "Origen y Geografía", content: "Originario de la gastronomía del pueblo mapuche (pueblo indígena de Chile y Argentina), principalmente de aquellos que habitan en la región de la Araucanía. Tradicionalmente era un condimento a base de sal triturada mezclada con ají, aunque hoy en día su producción se ha agilizado mediante el uso de molinos de martillo eléctricos." },
                    { title: "Perfil Sensorial", content: "Presenta un aspecto de polvo rojo ligeramente opaco con pequeñas escamas de distintas tonalidades. Su sabor es ligeramente picante y marcadamente ahumado. Comercialmente existen dos variedades definidas por sus ingredientes: el 'merkén natural', que contiene únicamente ají cacho de cabra y sal; y el 'merkén especial', que incorpora semillas de cilantro tostadas y trituradas para aportar frescura y suavizar el impacto del picante en boca." },
                    { title: "Usos comunes", content: "Se utiliza habitualmente en reemplazo del ají fresco en múltiples preparaciones. Es sumamente versátil y funciona de manera excelente en platos con carnes, pescados, acompañamientos como papas o verduras a la parrilla, e incluso en la elaboración de chocolates y confituras. PROCESO TRADICIONAL Y FORMULA: Se recolectan los ajíes verdes en verano, se dejan madurar a rojo intenso, se secan al sol y se ahúman a fuego. Tras colgarse en vigas, se muelen enteros (con semillas) en mortero de piedra. La proporción del 'merkén especial' es de aproximadamente 70% ají, 20% sal y 10% semillas de cilantro." }
                ]
            },
            {
                title: "Páprika", flag: "🇭🇺", category: "Dulce",
                introduction: "Ingrediente esencial de la cocina húngara y condimento popular a nivel mundial, elaborado a partir de pimientos molidos en un polvo fino.",
                sections: [
                    { title: "Origen y Geografía", content: "Aunque se originó en América del Sur, fue transportada a Europa por los exploradores españoles en el siglo XVI. Al llegar a Hungría, los agricultores locales desarrollaron su cultivo y molienda característica, transformándola en el pilar fundamental de su gastronomía tradicional, con una fuerte adopción posterior en el resto de Europa y América." },
                    { title: "Perfil Sensorial", content: "Se caracteriza por un perfil predominantemente dulce y sutilmente picante. Este polvo fino aporta un equilibrio aromático singular que, además de dar profundidad de sabor, otorga un color rojo vibrante muy característico a cualquier preparación culinaria." },
                    { title: "Usos comunes", content: "Es el componente indispensable del goulash (el famoso guiso de carne húngaro), además de utilizarse ampliamente en sopas, sauces, ensaladas y platos de carnes o pescados. Posee un rol técnico clave en la industria artesanal para la elaboración de embutidos, salchichas, ciertos tipos de quesos y encurtidos." }
                ]
            },
            {
                title: "Pimienta Blanca", flag: "🇮🇳", category: "Picante",
                introduction: "Semilla madura y desprovista de su corteza externa de la planta Piper nigrum, nativa de la Costa de Malabar en la India, valorada por su picor limpio, directo y su estética impecable.",
                sections: [
                    { title: "Origen y Geografía", content: "Proviene estrictamente de la planta Piper nigrum, una especie originaria de la Costa de Malabar, al suroeste de la India. Comparte cuna y genética con la pimienta negra y la verde, tratándose del mismo fruto pero en un estado avanzado de madurez. Para obtenerla, las bayas se cosechan cuando están completamente rojas. Luego se sumergen en agua corriente durante aproximadamente una semana para que el pericarpio (la piel exterior) se ablande y pueda ser removido de forma mecánica o manual, dejando expuesto únicamente el corazón de la semilla de color crema." },
                    { title: "Perfil Sensorial", content: "Ofrece un picante más agudo, directo y concentrado en el paladar que la pimienta negra, debido a la alta densidad de piperina en el núcleo de la semilla. Al carecer de la capa exterior, pierde las notas cítricas, frutales y frescas del pericarpio, desarrollando en su lugar un aroma más terroso, animal, fermentado y punzante. Su gran ventaja gastronómica es que aporta toda la potencia térmica del grano sin alterar la armonía visual de las preparaciones de color claro." },
                    { title: "Usos comunes", content: "Es el estándar de oro para sazonar salsas claras como la bechamel o salsa blanca, veloutés, purés de papas, cremas de verduras, platos de pasta claros y fondues de queso. También es muy utilizada en la elaboración de embutidos tradicionales y adobos para carnes blancas como aves o pescados delicados. TECNICA GASTRONOMICA: Sus aceites aromáticos son más volátiles que los de la pimienta negra; por lo tanto, se aconseja molerla en el momento y agregarla estrictamente hacia el final de la cocción para evitar que desarrolle notas excesivamente amargas." }
                ]
            },
            {
                title: "Pimienta Negra", flag: "🇮🇳", category: "Picante",
                introduction: "Fruto entero, drupáceo y deshidratado de la planta Piper nigrum, cosechado de forma prematura y venerado mundialmente como la reina de las especias.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativa absoluta de la Costa de Malabar, una franja costera situada al suroeste de la India en el actual estado de Kerala. Históricamente considerado el 'oro negro', su comercio impulsó la Era de los Descubrimientos y trazó rutas navales globales. Compartiendo planta con la pimienta blanca y la verde, la versión negra se obtiene recolectando las bayas a mitad de su maduración, cuando tornan a un color verde amarillento, para luego someterlas a un breve escaldado y un proceso de secado al sol que deshidrata y arruga su corteza." },
                    { title: "Perfil Sensorial", content: "Presenta una superficie rugosa, negra y sumamente característica. Su perfil es el más complejo y redondo de la familia Piper nigrum, ya que combina el picor punzante y limpio de la piperina concentrada en su núcleo con las notas cítricas, amaderadas, florales y frescas que retiene el pericarpio (la piel exterior) al oxidarse y secarse. Posee una gran persistencia en boca que realza los sabores circundantes." },
                    { title: "Usos comunes", content: "Condimento universal de mesa y pilar en la elaboración de caldos, estofados, adobos, embutidos y salsas clásicas del mundo (como la emblemática Cacio e Pepe italiana). Es un componente crucial en mezclas como el Garam Masala. TECNICA GASTRONOMICA: Sus aceites esenciales y compuestos volátiles se disipan velozmente ante el calor extremo y el oxígeno. Por ello, la regla de oro culinaria exige moler el grano entero estrictamente al momento de servir o hacia el final de la cocción para preservar su abanico aromático intacto." }
                ]
            },
            {
                title: "Pimienta Verde", flag: "🇮🇳", category: "Herbal",
                introduction: "Baya inmadura y fresca de la planta Piper nigrum, nativa de la Costa de Malabar en la India, valorada por su perfil aromático sutil, fresco y notablemente herbal.",
                sections: [
                    { title: "Origen y Geografía", content: "Proviene de la misma planta que la pimienta negra y blanca, la Piper nigrum, originaria de la Costa de Malabar al suroeste de la India. Representa el eslabón inicial de la cosecha, recolectándose cuando los granos están completamente verdes e inmaduros. Para evitar que la baya se oxide, se arrugue y se transforme en pimienta negra debido a las enzimas ambientales, requiere un procesamiento técnico inmediato tras su cosecha, sumergiéndola en salmueras, vinagres o sometiéndola a un proceso de liofilización." },
                    { title: "Perfil Sensorial", content: "Es la más suave y fresca de las tres variantes de la Piper nigrum. Su nivel de picor es notablemente menor debido a que la piperina aún no se ha concentrado por completo en el núcleo. En su lugar, despliega un perfil intensamente herbal, frutal y cítrico, con una textura tierna y jugosa cuando se conserva en medio líquido, lo que permite morder el grano entero de forma agradable sin saturar las papilas gustativas." },
                    { title: "Usos comunes", content: "Es la gran protagonista de la cocina clásica internacional en salsas emulsionadas para carnes rojas y aves, como la emblemática 'salsa a la pimienta verde' con base de crema y cognac. También funciona de manera excelente en terrinas, patés, platos de pescado e incluso en marinadas de frutas exóticas. TECNICA GASTRONOMICA: Al ser un grano tierno, se añade entero o apenas machacado directamente en las salsas durante los últimos minutos de reducción, logrando que libere su jugo cítrico y herbal de forma armónica." }
                ]
            },
            {
                title: "Pimienta Rosa", flag: "🇦🇷🇧🇷", category: "Aromático",
                introduction: "Bayas secas de los árboles Schinus molle (Aguaribay) and Schinus terebinthifolius (Turbinto). No son pimientas auténticas, sino drupas de la familia Anacardiaceae.",
                sections: [
                    { title: "Origen y Geografía", content: "El Aguaribay es nativo de la región andina y el Cono Sur (Argentina/Perú), mientras que el Turbinto proviene del área subtropical de Brasil. Ambos se han naturalizado globalmente como 'falsos pimenteros' por la similitud de su fruto con la pimienta negra." },
                    { title: "Perfil Sensorial", content: "Aroma resinoso, dulce y cítrico. El Aguaribay tiende a ser más rústico y levemente picante, con notas que recuerdan al pino. El Turbinto es más delicado, frutal y estético. Ninguna posee piperina; su carácter es puramente aromático y volátil." },
                    { title: "Usos comunes", content: "Indispensable en la 'Pimienta de las 4 estaciones'. Por su fragilidad, se usa entera o apenas machacada en carpaccios, pescados blancos y coctelería premium (Gin Tonic). Nota técnica: Su alto contenido en aceites esenciales requiere que no se someta a cocciones prolongadas para evitar que el sabor resinoso se torne amargo." }
                ]
            },
            {
                title: "Ras el Hanout", flag: "🇲🇦", category: "Mezcla",
                introduction: "Mezcla marroquí compleja y aromática. Significa 'lo mejor de la tienda'.",
                sections: [
                    { title: "Composición y Sabor", content: "Puede tener más de 30 ingredientes, incluidos pétalos de rosa o lavanda." },
                    { title: "Usos en la Cocina", content: "Esencial en tajines, cuscús y carnes asadas." },
                    { title: "Métodos de Aplicación", content: "Se puede espolvorear directamente sobre proteínas, añadir al principio de guisos o diluir en aceite de oliva para crear adobos complejos." }
                ]
            },
            {
                title: "Shichimi Togarashi", flag: "🇯🇵", category: "Picante",
                introduction: "'Siete sabores de chile', mezcla japonesa picante, cítrica y con notas de sésamo.",
                sections: [
                    { title: "Composición Típica", content: "Chile rojo, sansho, piel de naranja, sésamo, amapola, cáñamo y alga nori." },
                    { title: "Usos en la Cocina", content: "Condimento final para ramen, udon, yakitori y tempura." }
                ]
            },
            {
                title: "Sumaque", flag: "🇹🇷", category: "Aromático",
                introduction: "Especia obtenida de las bayas rojas y deshidratadas del arbusto Rhus coriaria, venerada en la cocina de Medio Oriente por su excepcional acidez natural.",
                sections: [
                    { title: "Origen y Geografía", content: "Nativo de las regiones mediterráneas, el sur de Europa y de todo el Medio Oriente e Irán. Ha sido utilizado desde la antigüedad clásica como agente acidificante antes de la introducción masiva de los limones." },
                    { title: "Perfil Sensorial", content: "Color púrpura rojizo vibrante y textura de polvo grueso. Perfil fresco, frutal y marcadamente ácido, evocando al jugo de limón pero sin aportar humedad a la preparación." },
                    { title: "Usos Comunes", content: "Componente clave de la mezcla Zaatar, condimento tradicional para brochetas, hummus, arroces y la ensalada Fattoush." }
                ]
            },
            {
                title: "Tahini", flag: "🇱🇧", category: "Mezcla",
                introduction: "Pasta fluida y oleosa obtenida a partir de la molienda de semillas de sésamo o ajonjolí (Sesamum indicum), pilar fundamental e identitario de la gastronomía del Líbano.",
                sections: [
                    { title: "Origen y Geografía", content: "Originario del Líbano, país que se posiciona históricamente como el epicentro cultural de su desarrollo y el estándar de oro en su elaboración tradicional." },
                    { title: "Perfil Sensorial", content: "Textura cremosa y densa en el paladar. Sabor untuoso, tostado, con matices marcados a frutos secos y un sutil amargor final que le confiere complejidad." },
                    { title: "Usos Comunes", content: "Componente obligatorio y aglutinante del hummus clásico, del baba ganoush y base de la salsa Taratur." }
                ]
            },
            {
                title: "Z'atar", flag: "🇱🇧", category: "Mezcla",
                introduction: "Mezcla de especias y hierbas silvestres originaria de la región del Levante, considerada un pilar identitario de la cultura gastronómica del Mediterráneo Oriental.",
                sections: [
                    { title: "Origen y Geografía", content: "Ampliamente arraigado en el Líbano, Siria, Jordania y Palestina. La palabra zaatar denomina tanto a la mezcla como al tomillo silvestre que le da origen." },
                    { title: "Perfil Sensorial", content: "Equilibra notas profundamente herbales y amaderadas del tomillo con la acidez frutal del sumaque y el carácter oleoso del sésamo tostado." },
                    { title: "Usos Comunes", content: "Ingrediente estelar del Manousheh (pan plano). Se mezcla en partes iguales con aceite de oliva virgen extra para formar un dip aromático." }
                ]
            },
            {
                title: "Cúrcuma", flag: "🇮🇳", category: "Aromático",
                introduction: "Rizoma subterráneo de la planta Curcuma longa, perteneciente a la familia del jengibre, venerado por su intenso color amarillo dorado y sus propiedades medicinales.",
                sections: [

                    { title: "Perfil Sensorial", content: "Posee un aroma cálido, amaderado y con notas sutilmente cítricas. En boca ofrece un sabor terroso, ligeramente amargo y almizclado." },
                    { title: "Usos Comunes", content: "Ingrediente indispensable para aportar color y base terrosa al curry en polvo, mezclas masala y platos tradicionales de arroz o legumbres." }
                ]

            {
                title: "Locoto", flag: "🇧🇴", category: "Picante",

        let bookData = { recetas: [], glosario: GLOSARIO_DATA };
        let currentState = 'PORTADA';
        let currentIndex = 0;

        function init() {
            loadRecipesDatabase();
        }

        // CARGA DIRECTA Y SEGURA DE RECETAS DESDE EL ARCHIVO QUE CORREGIMOS
        function loadRecipesDatabase() {
            fetch('recetas.json')
                .then(response => {
                    if (!response.ok) throw new Error('Error al sincronizar recetas.json');
                    return response.json();
                })
                .then(data => {
                    bookData.recetas = data;
                    render();
                    setupGlobalEvents();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('page-indicator').innerText = "Error de sincronización con recetas.json";
                });
        }

        function render() {
            const left = document.getElementById('left-page');
            const right = document.getElementById('right-page');
            const indicator = document.getElementById('page-indicator');

            if (!left || !right || !indicator) return;

            left.innerHTML = '';
            right.innerHTML = '';

            if (currentState === 'PORTADA') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Libro de Cocina</div>
                    <div class="cover-title">Mis Recetas</div>
                    <div class="cover-author">Por Alejandro Haudet</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">"Un paseo culinario por los sabores de casa, técnicas tradicionales y el alma de nuestra cocina."</p>
                </div>`;
                indicator.innerText = "PORTADA";
            } 
            
            else if (currentState === 'RECETAS') {
                const r = bookData.recetas[currentIndex];
                // Formateador automático para que busque las fotos dentro de la carpeta correspondiente
                const finalImgPath = r.image ? (r.image.includes('/') ? r.image : `fotos-receta/${r.image}`) : '';

                left.innerHTML = `
                    <div class="section-tag">Capítulo I • Recetario</div>
                    <h1>${r.title}</h1>
                    <div class="metadata-line">${r.category || 'Plato Principal'}</div>
                    ${finalImgPath ? `<img src="${finalImgPath}" class="item-image" onerror="this.style.display='none';">` : ''}
                    <h2>Ingredientes</h2>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                `;
                
                const pasosArr = r.instructions.split(',');
                const pasosHtml = pasosArr.map(paso => paso.trim() ? `<li>${paso.trim()}</li>` : '').join('');
                
                right.innerHTML = `
                    <div class="metadata-line" style="text-align:right">Preparación</div>
                    <ol>${pasosHtml}</ol>
                    ${r.authorComments ? `<div class="chef-notes">${r.authorComments}</div>` : ''}
                `;
                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;
            }

            else if (currentState === 'SEPARADOR') {
                left.innerHTML = `<div class="cover-page">
                    <div class="cover-subtitle">Anexo Técnico</div>
                    <div class="cover-title" style="font-size:35pt">Glosario de Especias</div>
                </div>`;
                right.innerHTML = `<div class="cover-page">
                    <p style="max-width:300px; font-style:italic; color:#8c7662">Estudio de los pilares aromáticos y botánicos que definen nuestra identidad gastronómica.</p>
                </div>`;
                indicator.innerText = "SECCIÓN: ESPECIAS";
            }

            else if (currentState === 'GLOSARIO') {
                const e = bookData.glosario[currentIndex];

                left.innerHTML = `
                    <div class="section-tag">Capítulo II • Glosario</div>
                    <h1>${e.title} <span class="flag-emoji">${e.flag}</span></h1>
                    <div class="metadata-line">Perfil: ${e.category}</div>
                    <p><em>${e.introduction}</em></p>
                `;
                let secHtml = e.sections ? e.sections.map(s => `<h2>${s.title}</h2><p>${s.content}</p>`).join('') : '';
                right.innerHTML = `<div class="metadata-line" style="text-align:right">Análisis Técnico</div>${secHtml}`;
                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }

            // Twemoji renderiza las banderas vectoriales de forma limpia y uniforme en Windows
            twemoji.parse(document.body);
        }

        function goForward() {
            if (currentState === 'PORTADA') { currentState = 'RECETAS'; currentIndex = 0; }
            else if (currentState === 'RECETAS') {
                if (currentIndex < bookData.recetas.length - 1) currentIndex++;
                else { currentState = 'SEPARADOR'; currentIndex = 0; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'GLOSARIO'; currentIndex = 0; }
            else if (currentState === 'GLOSARIO') {
                if (currentIndex < bookData.glosario.length - 1) currentIndex++;
            }
            render();
        }

        function goBack() {
            if (currentState === 'GLOSARIO') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'SEPARADOR'; }
            }
            else if (currentState === 'SEPARADOR') { currentState = 'RECETAS'; currentIndex = bookData.recetas.length - 1; }
            else if (currentState === 'RECETAS') {
                if (currentIndex > 0) currentIndex--;
                else { currentState = 'PORTADA'; }
            }
            render();
        }

        function setupGlobalEvents() {
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('glossary-link')) {
                    const targetSpice = e.target.getAttribute('data-target');
                    if (targetSpice) {
                        const index = bookData.glosario.findIndex(g => g.title.toLowerCase() === targetSpice.toLowerCase());
                        if (index !== -1) {
                            currentState = 'GLOSARIO';
                            currentIndex = index;
                            render();
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
