<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Cocina e Índice de Especias</title>
    <style>
        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .book-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 650px;
            background-color: #fcfbfa;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        .book-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0) 50%, rgba(0,0,0,0.15));
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .page {
            width: 50%;
            padding: 45px 50px;
            box-sizing: border-box;
            background-color: #fcfbfa;
            overflow-y: auto;
        }
        .page-left {
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .page-right {
            border-left: 1px solid rgba(0,0,0,0.05);
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .section-tag {
            font-family: 'Arial', sans-serif;
            font-size: 8.5pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8c7662;
            margin-bottom: 10px;
            font-weight: bold;
        }
        h1 {
            font-size: 26pt;
            color: #5c1d1d;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: normal;
            line-height: 1.2;
        }
        .metadata-line {
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a6855;
            border-bottom: 1px solid #e2dacd;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5c1d1d;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #e2dacd;
            padding-bottom: 4px;
        }
        p, li {
            color: #2c2520;
            line-height: 1.6;
            font-size: 11pt;
            text-align: justify;
        }
        ul, ol {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        li {
            margin-bottom: 6px;
        }
        .glossary-link {
            color: #5c1d1d;
            text-decoration: none;
            border-bottom: 1px dashed #5c1d1d;
            cursor: pointer;
            font-weight: bold;
        }
        .glossary-link:hover {
            background-color: #f5efe6;
            border-bottom: 1px solid #5c1d1d;
        }
        .specie-box {
            background-color: #f7f3ed;
            border: 1px solid #e2dacd;
            padding: 15px;
            margin-top: 15px;
            font-size: 10pt;
        }
        .specie-box table {
            width: 100%;
            border-collapse: collapse;
        }
        .specie-box td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .specie-box .label {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: #8c7662;
            width: 30%;
        }
        .chef-notes {
            background-color: #f5efe6;
            border-left: 3px solid #8c7662;
            padding: 12px 15px;
            margin-top: auto;
            font-style: italic;
            font-size: 10.5pt;
        }
        .nav-controls {
            display: flex;
            gap: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            align-items: center;
        }
        .nav-btn {
            background: none;
            border: 1px solid #8c7662;
            color: #8c7662;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background-color: #8c7662;
            color: white;
        }
        @media (max-width: 850px) {
            .book-container {
                flex-direction: column;
                min-height: auto;
            }
            .book-container::after {
                display: none;
            }
            .page {
                width: 100%;
                padding: 30px 25px;
            }
            .page-left {
                border-right: none;
                border-bottom: 1px dashed #e2dacd;
            }
            .page-right {
                padding-left: 25px;
                border-left: none;
            }
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="page page-left" id="left-page-content"></div>
        <div class="page page-right" id="right-page-content"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goToPrev()">← Anterior</button>
        <span id="page-indicator" style="font-family: Arial, sans-serif; color: #666; font-size: 10pt; font-weight: bold;">Cargando...</span>
        <button class="nav-btn" onclick="goToNext()">Siguiente →</button>
    </div>

    <script>
        // BASE DE DATOS LOCAL SEGURA (Evita problemas de carga externa)
        const DATA_SET = {
            recetas: [
                {
                    titulo: "Empanadas de osobuco braseado",
                    subtitulo: "Entrante Tradicional Premium",
                    meta: "Categoría: Entrante, Plato Principal",
                    ingredientes: [
                        "1 Kg de osobuco [cite: 1]",
                        "8 cebollas [cite: 1]",
                        "1 pimiento rojo mediano [cite: 1]",
                        "Parte verde del verdeo c/n [cite: 1]",
                        "Para la salsa yasgua: 2 tomates perita, ají locoto a gusto, vinagre 2 cdas, sal y aceite de oliva [cite: 1]"
                    ],
                    preparacion: "<p>1. Salpimentar el osobuco y dorar en la olla. Agregar 3 cebollas en mitades y c/n de agua. Llevar a hervor por 3 horas aprox[cite: 1].</p><p>2. Dejar enfriar y desmechar el osobuco. Reservar el caldo. Cortar y rehogar las cebollas restantes con el pimiento rojo[cite: 1].</p><p>3. Cuando estén cristalinas, agregar el osobuco, abundante pimentón dulce, ají molido y comino. Agregar caldo hasta cubrir[cite: 1].</p><p>4. Dejar enfriar. Picar la parte verde de la cebolla de verdeo y colocar por encima. Armar las empanadas y llevar a horno máximo (180°C)[cite: 1].</p>",
                    notas: "Para la salsa yasgua: Rallar los tomates pelados, condimentar con sal, el locoto, el vinagre y un toque de aceite de oliva[cite: 1]. Comer agregando la yasgua o con jugo de limón[cite: 1]."
                },
                {
                    titulo: "Cazuela de Mariscos",
                    subtitulo: "Plato de Mar de Alejandro",
                    meta: "Categoría: Plato Principal",
                    ingredientes: [
                        "250 g de camarones, mejillones y langostinos [cite: 1]",
                        "250 g de anillos de calamar y 200 g de berberechos [cite: 1]",
                        "1 cebolla, 2 dientes de ajo, 1 pimiento morrón rojo, 1 tomate [cite: 1]",
                        "150 ml de vino blanco, 500 ml de caldo de verdura, 1 hoja de laurel [cite: 1]",
                        "Pimienta negra, 1 cdita de <span class='glossary-link' data-target='Shichimi Togarashi'>Shichimi Togarashi</span> y 2 cditas de <span class='glossary-link' data-target='Merkén'>Merkén</span> [cite: 1]"
                    ],
                    preparacion: "<p>1. Limpiar los frutos de mar. Aparte picar la cebolla, el ajo y el morrón; sofreír en una olla con aceite de oliva y sal[cite: 1].</p><p>2. Picar el tomate, añadir a la preparación y cocinar 10 minutos[cite: 1].</p><p>3. Añadir el vino blanco, el caldo, el laurel, la pimienta y el Shichimi; corregir sazón[cite: 1].</p><p>4. Añadir los anillos de calamar. Cocinar dos o tres minutos y agregar el resto de los mariscos. Cocinar 10 minutos más[cite: 1].</p>",
                    notas: "Se puede servir sobre un 'colchón' de arroz blanco. Acompañar con Chardonnay entre 4 y 6°C[cite: 1]."
                },
                {
                    titulo: "Empanadas Árabes, Sfijas o Fatay",
                    subtitulo: "Especialidad Exótica",
                    meta: "Categoría: Entrante, Plato Principal",
                    ingredientes: [
                        "1 Kg de carne molida, 2 cebollas grandes, 1 morrón rojo [cite: 1]",
                        "1 morrón verde, 2 tomates perita, 2 dientes de ajo [cite: 1]",
                        "Menta, cilantro y perejil c/n [cite: 1]",
                        "1 cucharada de <span class='glossary-link' data-target='Bahārāt'>Bahārāt</span> y 2 cucharaditas de sal [cite: 1]",
                        "El jugo de 6 limones [cite: 1]"
                    ],
                    preparacion: "<p>1. Picar finamente las cebollas, tomates, pimientos y hierbas[cite: 1].</p><p>2. Mezclar en un bol la carne molida con las verduras cortadas, el baharat, sal y el jugo de los 6 limones[cite: 1].</p><p>3. Tapar con film y dejar reposar como mínimo 2 horas[cite: 1].</p><p>4. Armar las empanadas y llevar a horno máximo (180°C) hasta dorar[cite: 1].</p>",
                    notas: "Si no tenés baharat podés reemplazarlo por estas especias: comino, canela, coriandro, cardamomo, pimienta, pimentón[cite: 1]."
                }
            ],
            glosario: [
                {
                    elemento: "Bahārāt",
                    botanica: "Mezcla de Especias de Oriente Medio [cite: 1]",
                    origen: "Oriente Medio / Tradición Árabe [cite: 1]",
                    descripcion: "<p>Significa «especias» en árabe. Es una mezcla cálida y aromática con fuertes notas terrosas y ahumadas[cite: 1]. Versión tradicional tunecina lleva capullos de rosa[cite: 1].</p>",
                    maridaje: "Se compone de pimienta negra, cilantro, pimentón, cardamomo, nuez moscada, comino, clavos y canela[cite: 1]. Ideal para cordero, pollo y arroces[cite: 1]."
                },
                {
                    elemento: "Merkén",
                    botanica: "Condimento Mapuche Ahumado [cite: 1]",
                    origen: "Chile y Argentina [cite: 1]",
                    descripcion: "<p>Condimento tradicional de origen mapuche. Posee un marcado perfil aromático terroso, rústico y profundamente cálido[cite: 1].</p>",
                    maridaje: "Composición básica: Ají cacho de cabra ahumado con sal y cilantro tostado[cite: 1]. Va excelente en carnes, legumbres, papas y cazuelas[cite: 1]."
                },
                {
                    elemento: "Shichimi Togarashi",
                    botanica: "Siete Sabores de Chile [cite: 1]",
                    origen: "Japón [cite: 1]",
                    descripcion: "<p>Mezcla japonesa picante, marcadamente cítrica y con notas oleosas de sésamo y algas marinas[cite: 1].</p>",
                    maridaje: "Compuesto por chile rojo, sansho, piel de naranja, sésamo, amapola, cáñamo y alga nori[cite: 1]. Condimento final para caldos, ramen, udon y tempura[cite: 1]."
                }
            ]
        };

        let bookData = DATA_SET;
        let currentSection = 'recetas';
        let currentIndex = 0;

        function loadBookData() {
            // Inicializa directo del set seguro para que no se quede colgado
            renderPage();
            setupGlobalEvents();
        }

        function renderPage() {
            const leftPage = document.getElementById('left-page-content');
            const rightPage = document.getElementById('right-page-content');
            const indicator = document.getElementById('page-indicator');

            if (!leftPage || !rightPage || !indicator) return;

            if (currentSection === 'recetas') {
                const receta = bookData.recetas[currentIndex];
                if (!receta) return;

                leftPage.innerHTML = `
                    <div class="section-tag">Capítulo I • El Recetario</div>
                    <h1>${receta.titulo}</h1>
                    <div class="metadata-line">${receta.subtitulo}</div>
                    <h2>Ingredientes Requeridos</h2>
                    <ul>
                        ${receta.ingredientes.map(ing => `<li>${ing}</li>`).join('')}
                    </ul>
                `;

                rightPage.innerHTML = `
                    <div class="metadata-line" style="text-align: right;">${receta.meta}</div>
                    <h2>Procedimiento de Elaboración</h2>
                    <div class="steps-box">${receta.preparacion}</div>
                    <div class="chef-notes">
                        <strong>Notas del Autor:</strong> ${receta.notas}
                    </div>
                `;

                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;

            } else if (currentSection === 'glosario') {
                const especia = bookData.glosario[currentIndex];
                if (!especia) return;

                leftPage.innerHTML = `
                    <div class="section-tag">Anexo Técnico • Glosario de Especias</div>
                    <h1>${especia.elemento}</h1>
                    <div class="metadata-line">Especias del Mundo & Variedades Locales</div>
                    
                    <h2>Ficha de Identificación</h2>
                    <div class="specie-box">
                        <table>
                            <tr>
                                <td class="label">Nombre Común:</td>
                                <td><em>${especia.botanica}</em></td>
                            </tr>
                            <tr>
                                <td class="label">Procedencia:</td>
                                <td>${especia.origen}</td>
                            </tr>
                        </table>
                    </div>
                `;

                rightPage.innerHTML = `
                    <div class="metadata-line" style="text-align: right;">Índice Temático</div>
                    <h2>Perfil Aromático y Descripción</h2>
                    ${especia.descripcion}
                    <h2>Sugerencia de Uso & Maridaje</h2>
                    <p>${especia.maridaje}</p>
                `;

                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }
        }

        function goToNext() {
            if (currentSection === 'recetas') {
                if (currentIndex < bookData.recetas.length - 1) {
                    currentIndex++;
                } else {
                    currentSection = 'glosario';
                    currentIndex = 0;
                }
            } else if (currentSection === 'glosario') {
                if (currentIndex < bookData.glosario.length - 1) {
                    currentIndex++;
                }
            }
            renderPage();
        }

        function goToPrev() {
            if (currentSection === 'glosario') {
                if (currentIndex > 0) {
                    currentIndex--;
                } else {
                    currentSection = 'recetas';
                    currentIndex = bookData.recetas.length - 1;
                }
            } else if (currentSection === 'recetas') {
                if (currentIndex > 0) {
                    currentIndex--;
                }
            }
            renderPage();
        }

        // Sistema dinámico global para los clicks sin romper strings
        function setupGlobalEvents() {
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('glossary-link')) {
                    const targetSpice = e.target.getAttribute('data-target');
                    if (targetSpice) {
                        const index = bookData.glosario.findIndex(g => g.elemento.toLowerCase() === targetSpice.toLowerCase());
                        if (index !== -1) {
                            currentSection = 'glosario';
                            currentIndex = index;
                            renderPage();
                        }
                    }
                }
            });
        }

        window.onload = loadBookData;
    </script>
</body>
</html>
