<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Cocina e Índice de Especias</title>
    <style>
        body {
            background-color: #dcd6cd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .book-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 650px;
            background-color: #fcfbfa;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        .book-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0) 50%, rgba(0,0,0,0.15));
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .page {
            width: 50%;
            padding: 45px 50px;
            box-sizing: border-box;
            background-color: #fcfbfa;
            overflow-y: auto;
        }
        .page-left {
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .page-right {
            border-left: 1px solid rgba(0,0,0,0.05);
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .section-tag {
            font-family: 'Arial', sans-serif;
            font-size: 8.5pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8c7662;
            margin-bottom: 10px;
            font-weight: bold;
        }
        h1 {
            font-size: 26pt;
            color: #5c1d1d;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: normal;
            line-height: 1.2;
        }
        .metadata-line {
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a6855;
            border-bottom: 1px solid #e2dacd;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5c1d1d;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #e2dacd;
            padding-bottom: 4px;
        }
        p, li {
            color: #2c2520;
            line-height: 1.6;
            font-size: 11pt;
            text-align: justify;
        }
        ul, ol {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        li {
            margin-bottom: 6px;
        }
        .glossary-link {
            color: #5c1d1d;
            text-decoration: none;
            border-bottom: 1px dashed #5c1d1d;
            cursor: pointer;
            font-weight: bold;
        }
        .glossary-link:hover {
            background-color: #f5efe6;
            border-bottom: 1px solid #5c1d1d;
        }
        .specie-box {
            background-color: #f7f3ed;
            border: 1px solid #e2dacd;
            padding: 15px;
            margin-top: 15px;
            font-size: 10pt;
        }
        .specie-box table {
            width: 100%;
            border-collapse: collapse;
        }
        .specie-box td {
            padding: 4px 8px;
            vertical-align: top;
        }
        .specie-box .label {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: #8c7662;
            width: 30%;
        }
        .chef-notes {
            background-color: #f5efe6;
            border-left: 3px solid #8c7662;
            padding: 12px 15px;
            margin-top: auto;
            font-style: italic;
            font-size: 10.5pt;
        }
        .nav-controls {
            display: flex;
            gap: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            align-items: center;
        }
        .nav-btn {
            background: none;
            border: 1px solid #8c7662;
            color: #8c7662;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            font-size: 9.5pt;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background-color: #8c7662;
            color: white;
        }
        @media (max-width: 850px) {
            .book-container {
                flex-direction: column;
                min-height: auto;
            }
            .book-container::after {
                display: none;
            }
            .page {
                width: 100%;
                padding: 30px 25px;
            }
            .page-left {
                border-right: none;
                border-bottom: 1px dashed #e2dacd;
            }
            .page-right {
                padding-left: 25px;
                border-left: none;
            }
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="page page-left" id="left-page-content"></div>
        <div class="page page-right" id="right-page-content"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" onclick="goToPrev()">← Anterior</button>
        <span id="page-indicator" style="font-family: Arial, sans-serif; color: #666; font-size: 10pt; font-weight: bold;">Cargando...</span>
        <button class="nav-btn" onclick="goToNext()">Siguiente →</button>
    </div>

    <script>
        let bookData = {
            recetas: [],
            glosario: []
        };
        
        let currentSection = 'recetas';
        let currentIndex = 0;

        function loadBookData() {
            try {
                // He integrado el contenido real de tus archivos recetario y glosario para ahorrarte tiempo:
                bookData = {
                    recetas: [
                        {
                            titulo: "Empanadas de Osobuco Braseado",
                            subtitulo: "Entrante Tradicional Premium",
                            meta: "Categoría: Entrante, Plato Principal",
                            ingredientes: [
                                "1 Kg de osobuco",
                                "8 cebollas",
                                "1 pimiento rojo mediano",
                                "Parte verde del verdeo c/n",
                                "Salsa Yasgua: 2 tomates perita, Ají locoto a gusto, 2 cdas Vinagre, Sal y aceite de oliva a gusto."
                            ],
                            preparacion: "<p>1. Salpimentar el osobuco y dorar en la olla. Agregar 3 cebollas en mitades y c/n de agua.</p><p>2. Llevar a hervor por 3 horas aprox. Dejar enfriar y desmechar el osobuco. Reservar el caldo.</p><p>3. Cortar y rehogar las cebollas restantes con el pimiento. Cuando estén cristalinas, agregar el osobuco, abundante pimentón dulce, ají molido y comino. Cubrir con caldo.</p><p>4. Dejar enfriar. Armar las empanadas con la parte verde del verdeo cruda por encima. Hornear a máximo hasta dorar.</p>",
                            notas: "Para la salsa yasgua: Rallar los tomates previamente pelados, condimentar con sal, el locoto, el vinagre y aceite de oliva. Comer agregando la yasgua o con jugo de limón."
                        },
                        {
                            titulo: "Cazuela de Mariscos",
                            subtitulo: "Sabores del Mar",
                            meta: "Categoría: Plato Principal",
                            ingredientes: [
                                "250g camarones, 250g mejillones, 250g langostinos, 250g anillos de calamar, 200g berberechos",
                                "1 cebolla, 2 dientes de ajo, 1 pimiento morrón rojo, 1 tomate",
                                "150 ml de vino blanco, 500 ml de caldo de verdura, 1 hoja de laurel",
                                "Pimienta negra a gusto, 1 cdita de <span class='glossary-link' onclick='jumpToSpecie(\"Shichimi Togarashi\")'>Shichimi Togarashi</span>",
                                "2 cditas de <span class='glossary-link' onclick='jumpToSpecie(\"Merkén\")'>Merkén</span>, Aceite de oliva c/n"
                            ],
                            preparacion: "<p>1. Limpiar los frutos de mar y reservar. Aparte picar la cebolla, el ajo y el morrón y sofreír en una olla con aceite de oliva y sal.</p><p>2. Picar el tomate y añadir a la preparación; cocinar 10 minutos.</p><p>3. Añadir el vino blanco, el caldo, el laurel, la pimienta y el Shichimi; corregir sazón.</p><p>4. Añadir los anillos de calamar. Cocinar 2 o 3 minutos y agregar el resto de los mariscos. Cocinar por 10 minutos más cuidando la cocción.</p>",
                            notas: "Se puede servir sobre un 'colchón' de arroz blanco. Acompañar con un vino Chardonnay bien frío entre 4 y 6°C."
                        },
                        {
                            titulo: "Empanadas Árabes (Sfijas o Fatay)",
                            subtitulo: "Cocina Internacional",
                            meta: "Categoría: Entrante, Plato Principal",
                            ingredientes: [
                                "1 Kg de carne molida",
                                "2 cebollas grandes, 1 morrón rojo chico, 1 morrón verde chico, 2 tomates perita, 2 dientes de ajo",
                                "Menta, cilantro y perejil c/n",
                                "1 cucharada de <span class='glossary-link' onclick='jumpToSpecie(\"Bahārat\")'>Bahārat</span>",
                                "2 cucharaditas de sal, El jugo de 6 limones"
                            ],
                            preparacion: "<p>1. Picar finamente las cebollas, los tomates, los pimientos y el buqué de hierbas frescas. Reservar.</p><p>2. Colocar en un bol grande la carne molida y agregarle las verduras ya cortadas, el Bahārat, la sal y el jugo de los 6 limones.</p><p>3. Tapar con film y dejar reposar en frío como mínimo 2 horas para que la carne se cocine en el ácido cítrico.</p><p>4. Comenzar a armar las empanadas abiertas o en triángulo. Llevar a horno máximo (180°C o más) hasta dorar.</p>",
                            notes: "Si no tenés Bahārat, podés reemplazarlo usando una mezcla casera de: comino, canela, coriandro, cardamomo, pimienta y pimentón."
                        }
                    ],
                    glosario: [
                        {
                            elemento: "Bahārat",
                            botanica: "Mezcla de Especias de Oriente Medio",
                            origen: "Comercio de especias árabe",
                            descripcion: "<p>Significa literalmente «especias» en árabe. Es una mezcla cálida, aromática, con fuertes notas terrosas y ligeramente ahumadas que definen los guisados de la región.</p>",
                            maridaje: "Composición típica: pimienta negra, cilantro, pimentón, cardamomo, nuez moscada, comino, clavos y canela. Ideal para cordero, pollo o las famosas Sfijas."
                        },
                        {
                            elemento: "Merkén",
                            botanica: "Condimento Tradicional Mapuche",
                            origen: "Chile y Región Patagónica de Argentina",
                            descripcion: "<p>Un condimento completamente ahumado de sabor terroso, profundo y cálido. Es el alma de la cocina del sur andino.</p>",
                            maridaje: "Hecho a base de ají 'cacho de cabra' seco y ahumado, mezclado con sal y semillas de cilantro tostadas. Va excelente en cazuelas, carnes rojas y legumbres."
                        },
                        {
                            elemento: "Shichimi Togarashi",
                            botanica: "Siete Sabores de Japón",
                            origen: "Japón",
                            descripcion: "<p>Mezcla japonesa tradicional que aporta un perfil picante, marcadamente cítrico y con notas sutiles a frutos secos y algas marinas.</p>",
                            maridaje: "Contiene chile rojo, sansho, piel de naranja, sésamo, amapola, cáñamo y alga nori. Es el condimento de mesa ideal para finalizar caldos, ramen, udon o cazuelas complejas."
                        }
                    ]
                };

                renderPage();
            } catch (error) {
                console.error("Error al procesar los datos integrados:", error);
            }
        }

        function renderPage() {
            const leftPage = document.getElementById('left-page-content');
            const rightPage = document.getElementById('right-page-content');
            const indicator = document.getElementById('page-indicator');

            if (currentSection === 'recetas') {
                const receta = bookData.recetas[currentIndex];
                if (!receta) return;

                leftPage.innerHTML = `
                    <div class="section-tag">Capítulo I • El Recetario</div>
                    <h1>${receta.titulo}</h1>
                    <div class="metadata-line">${receta.subtitulo}</div>
                    <h2>Ingredientes Requeridos</h2>
                    <ul>
                        ${receta.ingredientes.map(ing => `<li>${ing}</li>`).join('')}
                    </ul>
                `;

                rightPage.innerHTML = `
                    <div class="metadata-line" style="text-align: right;">${receta.meta}</div>
                    <h2>Procedimiento de Elaboración</h2>
                    <div class="steps-box">${receta.preparacion}</div>
                    <div class="chef-notes">
                        <strong>Notas del Autor:</strong> ${receta.notas || receta.notes}
                    </div>
                `;

                indicator.innerText = `RECETA ${currentIndex + 1} / ${bookData.recetas.length}`;

            } else if (currentSection === 'glosario') {
                const especia = bookData.glosario[currentIndex];
                if (!especia) return;

                leftPage.innerHTML = `
                    <div class="section-tag">Anexo Técnico • Glosario de Especias</div>
                    <h1>${especia.elemento}</h1>
                    <div class="metadata-line">Especias del Mundo & Variedades Locales</div>
                    
                    <h2>Ficha de Identificación</h2>
                    <div class="specie-box">
                        <table>
                            <tr>
                                <td class="label">Nombre Técnico:</td>
                                <td><em>${especia.botanica}</em></td>
                            </tr>
                            <tr>
                                <td class="label">Procedencia Nata:</td>
                                <td>${especia.origen}</td>
                            </tr>
                        </table>
                    </div>
                `;

                rightPage.innerHTML = `
                    <div class="metadata-line" style="text-align: right;">Índice Temático</div>
                    <h2>Perfil Aromático y Descripción</h2>
                    ${especia.descripcion}
                    <h2>Sugerencia de Uso & Maridaje</h2>
                    <p>${especia.maridaje}</p>
                `;

                indicator.innerText = `ESPECIA ${currentIndex + 1} / ${bookData.glosario.length}`;
            }
        }

        function goToNext() {
            if (currentSection === 'recetas') {
                if (currentIndex < bookData.recetas.length - 1) {
                    currentIndex++;
                } else {
                    currentSection = 'glosario';
                    currentIndex = 0;
                }
            } else if (currentSection === 'glosario') {
                if (currentIndex < bookData.glosario.length - 1) {
                    currentIndex++;
                }
            }
            renderPage();
        }

        function goToPrev() {
            if (currentSection === 'glosario') {
                if (currentIndex > 0) {
                    currentIndex--;
                } else {
                    currentSection = 'recetas';
                    currentIndex = bookData.recetas.length - 1;
                }
            } else if (currentSection === 'recetas') {
                if (currentIndex > 0) {
                    currentIndex--;
                }
            }
            renderPage();
        }

        function jumpToSpecie(nombreEspecia) {
            const index = bookData.glosario.findIndex(g => g.elemento.toLowerCase() === nombreEspecia.toLowerCase());
            if (index !== -1) {
                currentSection = 'glosario';
                currentIndex = index;
                renderPage();
            }
        }

        window.onload = loadBookData;
    </script>
</body>
</html>
